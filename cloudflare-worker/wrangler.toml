name = "shadow-live"
main = "src/index.js"
compatibility_date = "2026-09-23"
workers_dev = true

[observability]
enabled = true

# Step 11 external prerequisite:
# Cloudflare account currently rejects Analytics Engine bindings with code 10089.
# Re-enable the PRESSURE_ANALYTICS binding only after Analytics Engine is enabled
# at the account level. The Worker telemetry code is intentionally safe/no-op
# while the binding is absent so Production deploys remain healthy.

[triggers]
# During development, settlement is also triggered by active game clients.
# A 5-minute safety sweep avoids a permanent Firestore read loop under quota pressure.
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "ROOM_REALTIME"
class_name = "RoomRealtimeObject"

[[migrations]]
tag = "room-realtime-v1"
new_sqlite_classes = ["RoomRealtimeObject"]
