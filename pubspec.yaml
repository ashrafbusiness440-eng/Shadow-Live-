name: voice_chat_room
description: A voice chat room application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^8.2.1
  material_design_icons_flutter: ^7.0.7296
  cached_network_image: ^4.0.0
  agora_rtc_engine: ^6.6.4
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  go_router: ^18.0.1
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  firebase_analytics: ^12.5.0
  intl: ^0.20.3
  flutter_bloc: ^9.1.1
  permission_handler: ^13.0.2
  image_picker: ^1.2.3
  crop_your_image: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/images/coins/
