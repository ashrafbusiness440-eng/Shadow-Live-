name: Cloudflare Phase 6 Settlement E2E

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/src/index.js'
      - 'cloudflare-worker/src/legacy-games/**'
      - 'cloudflare-worker/src/legacy-economy/**'
      - 'cloudflare-worker/wrangler.toml'
      - 'cloudflare-worker/scripts/phase6-settlement-e2e.mjs'
      - '.github/workflows/cloudflare-phase6-settlement-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-cloudflare-phase6-settlement-e2e
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Cloudflare phase 6 settlement E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/phase6-settlement-e2e.mjs
