name: Cloudflare Phase 9 User Access E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-production-firestore-e2e
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact Cloudflare build
        run: |
          for ATTEMPT in $(seq 1 60); do
            BODY=$(curl --silent --show-error https://shadow-live.ashraf-business-440.workers.dev/health || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"ok":true' && echo "$BODY" | grep -q "\"buildSha\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare Worker did not reach commit $GITHUB_SHA"
          exit 1
      - name: Run Phase 9 role and capability E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/phase9-user-access-e2e.mjs
