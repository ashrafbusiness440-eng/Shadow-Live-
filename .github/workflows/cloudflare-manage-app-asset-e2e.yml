name: Cloudflare Manage App Asset E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-production-firestore-e2e
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Cloudflare app asset manager E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SHADOW_ASSET_GITHUB_TOKEN: ${{ secrets.SHADOW_ASSET_GITHUB_TOKEN }}
        run: GITHUB_ASSET_TOKEN="$SHADOW_ASSET_GITHUB_TOKEN" node cloudflare-worker/scripts/manage-app-asset-e2e.mjs
