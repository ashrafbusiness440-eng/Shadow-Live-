name: Cloudflare Manage App Asset E2E

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/scripts/manage-app-asset-e2e.mjs'
      - '.github/workflows/cloudflare-manage-app-asset-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-cloudflare-manage-app-asset-e2e
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Cloudflare app asset manager E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_ASSET_TOKEN: ${{ secrets.GITHUB_ASSET_TOKEN }}
        run: node cloudflare-worker/scripts/manage-app-asset-e2e.mjs
