name: Shadow Control CI
on:
  pull_request:
    branches: [feature/recharge-main]
  push:
    branches: [feature/shadow-control-foundation]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: dart analyze lib/admin test/admin
      - run: flutter test test/admin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: functions
        run: npm install
      - working-directory: functions
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Firestore rules compile
        run: npx --yes firebase-tools@15.1.0 emulators:exec --only firestore --project shadow-control-ci "echo Firestore rules compiled"
      - name: Build Shadow Control web staging artifact
        run: flutter build web --release
      - name: Upload Shadow Control web artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-control-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7
