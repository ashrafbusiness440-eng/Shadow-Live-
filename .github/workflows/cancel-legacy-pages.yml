name: Cancel Legacy Shadow Live Pages Runs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-pages
  cancel-in-progress: true

jobs:
  cancel-legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Supersede any legacy Pages deployment still using the old concurrency group
        run: echo "Legacy Shadow Live Pages deployment lane superseded. Production publishing is handled only by deploy-shadow-control-pages.yml."
