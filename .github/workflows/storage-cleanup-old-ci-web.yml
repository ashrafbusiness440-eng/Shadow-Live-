name: Storage maintenance - old CI web artifacts only
on:
  push:
    branches:
      - maintenance/artifact-cleanup-20261025
    paths:
      - '.github/workflows/storage-cleanup-old-ci-web.yml'
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove reproducible CI web artifacts older than 24h (up to 80)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,datetime,math,time
          REPO="ashrafbusiness440-eng/Shadow-Live-"
          if os.environ["GH_REPO"] != REPO:
              raise SystemExit("Safety guard: unexpected repository")
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          API=f"https://api.github.com/repos/{REPO}/actions/artifacts"
          cutoff=datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(hours=24)
          names=("shadow-live-web","shadow-control-web")
          deleted_total=0
          bytes_deleted=0
          for name in names:
              def getpage(n):
                  url=API+"?"+urllib.parse.urlencode({"name":name,"per_page":100,"page":n})
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
              first=getpage(1)
              total=int(first.get("total_count",0))
              pages=max(1,math.ceil(total/100))
              selected=list(first.get("artifacts",[])) if pages==1 else []
              for page in range(max(2,pages-1),pages+1):
                  if pages!=1: selected.extend(getpage(page).get("artifacts",[]))
              eligible=[]
              for a in selected:
                  if a.get("name")!=name or a.get("expired"): continue
                  created=datetime.datetime.fromisoformat(a["created_at"].replace("Z","+00:00"))
                  if created>=cutoff: continue
                  if a.get("size_in_bytes",0)<5*1024*1024: continue
                  eligible.append(a)
              eligible.sort(key=lambda a:a["created_at"])
              targets=eligible[:40]
              print(json.dumps({"artifact":name,"total_matching":total,"selected_old":len(targets),"candidate_MB":round(sum(a["size_in_bytes"] for a in targets)/1e6,2)},ensure_ascii=False),flush=True)
              for a in targets:
                  req=urllib.request.Request(API+"/"+str(a["id"]),headers=headers,method="DELETE")
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r: status=r.status
                      if status==204:
                          deleted_total+=1
                          bytes_deleted+=a["size_in_bytes"]
                      else: print(f"Unexpected delete status {status} for {a['id']}",flush=True)
                  except urllib.error.HTTPError as err:
                      print(f"Deletion failed: artifact {a['id']} HTTP {err.code}",flush=True)
                      if err.code in (401,403,429): raise
                  time.sleep(0.05)
              print("FINISHED_NAME "+name,flush=True)
          print(f"CLEANUP_DELETED_COUNT={deleted_total}",flush=True)
          print(f"CLEANUP_FREED_MIB={bytes_deleted/1048576:.2f}",flush=True)
          print("GUARD: no source files, releases, pages artifacts, APKs or current-day CI artifacts deleted.",flush=True)
          PY
