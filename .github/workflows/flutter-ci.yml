name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check API JavaScript syntax
        run: |
          for file in api/*.js; do
            node --check "$file"
          done

      - name: Run economy and mic policy unit tests
        run: node --test server/__tests__/economy-policy.test.js server/__tests__/mic-activity.test.js server/__tests__/economy-permissions.test.js server/__tests__/room-rocket.test.js server/__tests__/game-engine.test.js

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install API integration test dependencies
        run: npm install --no-save firebase-admin@13.5.0 firebase@12.19.0 @firebase/rules-unit-testing@5.0.2

      - name: Run wallet gift and settlement Firestore integration tests
        run: npx --yes firebase-tools@15.1.0 emulators:exec --only firestore --project shadow-live-economy-test "node --test server/__tests__/wallet-actions.integration.test.js server/__tests__/gift-transactions.integration.test.js server/__tests__/firestore-security.integration.test.js server/__tests__/room-rocket.integration.test.js server/__tests__/reward-inventory.integration.test.js server/__tests__/cosmetic-room.integration.test.js server/__tests__/game-runtime.integration.test.js"

      - name: Audit Dart reachability
        run: python3 .github/scripts/find_unreachable_dart.py

      - name: Upload Dart reachability
        uses: actions/upload-artifact@v4
        with:
          name: dart-reachability
          path: dart_reachability.json
          if-no-files-found: error
          retention-days: 3

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Test
        run: flutter test

      - name: Build Shadow Control web
        run: |
          flutter build web --target lib/main_control.dart
          rm -rf build/control-web
          cp -R build/web build/control-web

      - name: Upload Shadow Control build
        uses: actions/upload-artifact@v4
        with:
          name: shadow-control-web
          path: build/control-web
          if-no-files-found: error
          retention-days: 3

      - name: Build web
        run: flutter build web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-web
          path: build/web
          if-no-files-found: error
          retention-days: 3

      - name: Build E2E web
        run: flutter build web --dart-define=E2E_TEST=true

      - name: Start E2E web server
        run: |
          python3 -m http.server 8088 --directory build/web > /tmp/shadow-e2e-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8088 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shadow-e2e-server.log
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Run main-tab browser E2E
        run: node .github/scripts/e2e_tabs.mjs

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-tab-e2e
          path: e2e-screenshots
          if-no-files-found: warn
          retention-days: 3

      - name: Build voice-room E2E web
        run: flutter build web --dart-define=E2E_ROOM_TEST=true

      - name: Start voice-room E2E server
        run: |
          python3 -m http.server 8089 --directory build/web > /tmp/shadow-room-e2e-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8089 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shadow-room-e2e-server.log
          exit 1

      - name: Run voice-room browser E2E
        run: node .github/scripts/e2e_voice_room.mjs

      - name: Upload voice-room E2E screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-room-e2e
          path: room-e2e-screenshots
          if-no-files-found: warn
          retention-days: 3

      - name: Build Shadow Control E2E web
        run: flutter build web --target lib/main_control.dart --dart-define=CONTROL_E2E_TEST=true

      - name: Start Shadow Control E2E server
        run: |
          python3 -m http.server 8090 --directory build/web > /tmp/shadow-control-e2e-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8090 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shadow-control-e2e-server.log
          exit 1

      - name: Run Shadow Control browser E2E
        run: node .github/scripts/e2e_control_rooms.mjs

      - name: Upload Shadow Control E2E screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-control-room-e2e
          path: control-e2e-screenshots
          if-no-files-found: warn
          retention-days: 3
