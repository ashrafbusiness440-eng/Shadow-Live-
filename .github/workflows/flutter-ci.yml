name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-flutter-ci-headless-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Independent checks run on parallel bounded GitHub runners; no gate is skipped.
  security-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit Cloudflare cutover
        run: python3 scripts/phase7_cloudflare_audit.py
      - name: Pressure regression guardrails
        run: python3 scripts/pressure_guardrail_audit.py
      - name: Audit Diaries Stage 09 pressure and security
        run: python3 scripts/diaries_stage09_audit.py
      - name: Audit Agency integration CI coverage
        run: python3 .github/scripts/audit_agency_ci_coverage.py
      - name: Check Cloudflare Worker JavaScript syntax
        run: |
          find cloudflare-worker/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify live room roster authentication and socket membership
        run: node --test server/__tests__/room-realtime-roster-access.test.js
      - name: Verify room chat toggle transaction and access checks
        run: node --test server/__tests__/room-chat-policy-transaction.test.js
      - name: Verify settings admission cache invalidation and live chat synchronization
        run: node --test server/__tests__/room-settings-realtime-sync.test.js
      - name: Verify safe Gift Catalog revisions and preserved gift history
        run: node --test server/__tests__/gift-catalog-update-policy.test.js server/__tests__/gift-category-policy.test.js server/__tests__/gift-draft-policy.test.js server/__tests__/gift-availability-policy.test.js server/__tests__/gift-visual-celebration.test.js server/__tests__/gift-recent-stats-policy.test.js server/__tests__/gift-totals-aggregation-policy.test.js server/__tests__/gift-ranking-policy.test.js server/__tests__/gift-stats-cursor-shim.test.js server/__tests__/gift-admin-permissions.test.js server/__tests__/store-catalog-policy.test.js server/__tests__/store-public-catalog.test.js server/__tests__/store-entitlement-preflight.test.js server/__tests__/store-admin-inventory-readonly.test.js server/__tests__/store-audit-readonly.test.js server/__tests__/store-purchase-history-readonly.test.js server/__tests__/store-financial-coverage-policy.test.js server/__tests__/store-global-daily-financial-review.test.js server/__tests__/store-global-daily-coverage-policy.test.js server/__tests__/store-finance-production-presence.test.js server/__tests__/store-financial-settlement-offline.test.js server/__tests__/store-full-refund-transaction-offline.test.js server/__tests__/store-daily-settlement-report.test.js server/__tests__/store-daily-settlement-pagination.test.js server/__tests__/store-refund-posting-day-parity.test.js server/__tests__/store-purchase-receipt-status.test.js server/__tests__/store-checkout-release-gate.test.js server/__tests__/store-grant-preview-disabled.test.js server/__tests__/store-grant-transaction-offline.test.js server/__tests__/store-purchase-transaction-offline.test.js
      - name: Verify suggested people privacy and follow filters
        run: node --test server/__tests__/home-discovery-people-privacy.test.js
      - name: Validate Cloudflare Durable Object bundle
        run: |
          npm --prefix cloudflare-worker install --no-audit --no-fund
          cd cloudflare-worker
          npx wrangler deploy --dry-run --outdir ../wrangler-dry-run
      - name: Run economy, agency financial security, mic, and realtime policy unit tests
        run: node --test server/__tests__/economy-policy.test.js server/__tests__/agency-data-model.test.js server/__tests__/agency-permissions.test.js server/__tests__/agency-financial-safety.test.js server/__tests__/mic-activity.test.js server/__tests__/economy-permissions.test.js server/__tests__/room-rocket.test.js server/__tests__/game-engine.test.js server/__tests__/room-realtime-protocol.test.js server/__tests__/room-realtime-presence.test.js server/__tests__/room-realtime-game.test.js server/__tests__/auth-state-reliability.test.js server/__tests__/firestore-reliability.test.js server/__tests__/config-cache.test.js server/__tests__/pressure-telemetry.test.js server/__tests__/room-realtime-pressure.test.js server/__tests__/room-rocket-feed.test.js server/__tests__/room-root-pressure-guard.test.js server/__tests__/pk-room-gift-score.test.js server/__tests__/room-level-surfaces.test.js server/__tests__/settlement-pressure-guard.test.js server/__tests__/agency-final-ui-regression.test.js server/__tests__/system-health.test.js server/__tests__/user-storage.test.js server/__tests__/asset-studio-core.test.js server/__tests__/relationships-core.test.js server/__tests__/diaries-core.test.js server/__tests__/content-filter.test.js server/__tests__/content-filter-control.test.js server/__tests__/diary-moderation.test.js server/__tests__/general-reports.test.js server/__tests__/reporter-report-notifications.test.js server/__tests__/admin-inbox.test.js server/__tests__/user-level-policy.test.js server/__tests__/user-level-summary.test.js server/__tests__/user-level-control.test.js server/__tests__/user-level-access.test.js server/__tests__/user-level-visibility.test.js server/__tests__/user-level-support-ranking.test.js server/__tests__/owner-absolute-room-access.test.js server/__tests__/vip-policy.test.js server/__tests__/vip-state.test.js server/__tests__/vip-level-control.test.js server/__tests__/vip-cosmetics.test.js server/__tests__/vip4-privacy-consumers.test.js server/__tests__/vip-upgrade-broadcast.test.js server/__tests__/vip-information-center.test.js server/__tests__/vip-runtime-closure.test.js server/__tests__/vip-final-closure.test.js
      - name: Test U6 image moderation security and review flows
        run: node --test server/__tests__/image-moderation-policy.test.js server/__tests__/image-moderation-gate.test.js server/__tests__/image-moderation-review.test.js server/__tests__/image-moderation-approval.test.js server/__tests__/image-moderation-appeal.test.js server/__tests__/image-moderation-retention.test.js server/__tests__/image-moderation-diary.test.js server/__tests__/image-moderation-chat.test.js server/__tests__/image-moderation-readiness.test.js
      - name: Test U6 account sanction appeal and verified reversal
        run: node --test server/__tests__/account-action-appeals.test.js
      - name: Verify self-service account deletion lifecycle safety
        run: node --test server/__tests__/account-deletion.test.js

      - name: Verify bounded deletion eligibility review and cancellation
        run: node --test server/__tests__/account-deletion-review.test.js

      - name: Verify owner-only account deletion retention review and holds
        run: node --test server/__tests__/account-deletion-review-control.test.js

      - name: Verify bounded read-only account erasure inventory
        run: node --test server/__tests__/account-deletion-erasure-inventory.test.js
      - name: Verify fail-closed account erasure preflight checkpoint
        run: node --test server/__tests__/account-deletion-erasure-checkpoint.test.js
      - name: Verify privacy-minimized completed account deletion logs
        run: node --test server/__tests__/account-deletion-completed-logs.test.js
      - name: Verify deleted account private chat and gift protections
        run: node --test server/__tests__/account-deletion-chat-tombstone.test.js
      - name: Reject unsafe legacy admin direct account deletion
        run: node --test server/__tests__/account-deletion-admin-direct-delete.test.js
      - name: Test U6 direct profile report, anti-spam and private chat compatibility
        run: node --test server/__tests__/report-duplicate-window.test.js
      - name: Test private-chat message visibility and five-minute deletion policy
        run: node --test server/__tests__/chat-message-visibility.test.js
      - name: Verify deleted accounts cannot receive new room gifts
        run: node --test server/__tests__/room-gift-deleted-account.test.js
      - name: Test gated redaction of historical deleted supporter snapshots
        run: node --test server/__tests__/account-deletion-support-snapshot-stage.test.js
      - name: Test gated one-record public identity erasure stage
        run: node --test server/__tests__/account-deletion-public-profile-stage.test.js
      - name: Test bounded legal-checked private text erasure primitive
        run: node --test server/__tests__/account-deletion-private-text-stage.test.js
      - name: Test certified R2 account cleanup queue gate
        run: node --test server/__tests__/account-deletion-r2-queue.test.js
      - name: Test gated per-counterparty follow and block erasure
        run: node --test server/__tests__/account-deletion-social-pair-stage.test.js
      - name: Private call push erasure stage safety
        run: node --test server/__tests__/account-deletion-private-call-push-stage.test.js
      - name: Test account-owned notification erasure safety
        run: node --test server/__tests__/account-deletion-notification-stage.test.js
      - name: Certified account deletion processing admission safety
        run: node --test server/__tests__/account-deletion-processing-admission.test.js
      - name: Bounded account notification and FCM token drainers
        run: node --test server/__tests__/account-deletion-bounded-drainers.test.js
      - name: Validate read-only diary and nested comment inventory pages
        run: node --test server/__tests__/account-deletion-diary-inventory-pages.test.js
      - name: Discover cross-owner diary comments without erasure
        run: node --test server/__tests__/account-deletion-cross-diary-comment-inventory.test.js
      - name: Read-only account diary like and view inventory safety
        run: node --test server/__tests__/account-deletion-diary-interaction-inventory.test.js
      - name: Guarded one-record diary like and view erasure tests
        run: node --test server/__tests__/account-deletion-diary-interaction-stage.test.js
      - name: Test bounded internal account erasure stage runner (production OFF)
        run: node --test server/__tests__/account-deletion-internal-phase-runner.test.js
      - name: Bounded retry-safe diary interaction erasure batches
        run: node --test server/__tests__/account-deletion-diary-interaction-batches.test.js
      - name: Safe private-chat conversation and authored-message inventory
        run: node --test server/__tests__/account-deletion-private-inventory-pages.test.js
      - name: Five-record fail-closed private text redaction batches
        run: node --test server/__tests__/account-deletion-private-text-batches.test.js
      - name: Read-only private voice object and draft inventory safety
        run: node --test server/__tests__/account-deletion-private-voice-inventory.test.js
      - name: Single exact-R2-HEAD private voice reconciliation
        run: node --test server/__tests__/account-deletion-private-voice-r2-head.test.js
      - name: Strict scoped R2 private voice orphan inventory pages
        run: node --test server/__tests__/account-deletion-private-voice-orphan-pages.test.js
      - name: Indexed shared room and agency ownership deletion blockers
        run: node --test server/__tests__/account-deletion-shared-asset-inventory-pages.test.js
      - name: Financial and Play purchase account-erasure review safety
        run: node --test server/__tests__/account-deletion-financial-review-pages.test.js
      - name: Legal report evidence and appeal retention review safety
        run: node --test server/__tests__/account-deletion-report-evidence-review-pages.test.js
      - name: Indexed owner-only image media deletion inventory safety
        run: node --test server/__tests__/account-deletion-image-storage-inventory.test.js
      - name: Read-only single-object image R2 HEAD reconciliation safety
        run: node --test server/__tests__/account-deletion-image-r2-head.test.js
      - name: Scoped five-object personal image orphan discovery safety
        run: node --test server/__tests__/account-deletion-personal-image-r2-orphan-pages.test.js
      - name: Read-only pending image upload-ticket inventory safety
        run: node --test server/__tests__/account-deletion-image-upload-ticket-review.test.js
      - name: Enforce server-issued room invite password-lock scope
        run: node --test cloudflare-worker/__tests__/room-invite-lock-policy.test.js
      - name: Check room receiver rankings use verified atomic gifts and bounded reads
        run: node --test cloudflare-worker/__tests__/room-receiver-ranking-source.test.js
      - name: Verify managed-room shortcuts authorization and bounded membership
        run: node --test cloudflare-worker/__tests__/managed-room-shortcuts-source.test.js cloudflare-worker/__tests__/room-moderator-index-backfill.test.js
      - name: Test replay-safe private text sends and cross-user operation isolation
        run: node --test cloudflare-worker/__tests__/private-chat-text-retry.test.js
      - name: Test private voice mutual-follow eligibility and limits
        run: node --test cloudflare-worker/__tests__/private-voice-eligibility.test.js
      - name: Test private R2 voice-note authorization, transactions and limits
        run: node --test cloudflare-worker/__tests__/private-voice-media.test.js
      - name: Test private call signaling safety and lifecycle
        run: node --test cloudflare-worker/__tests__/private-call-signaling.test.js
      - name: Test gated incoming call FCM sender and account-scoped devices
        run: node --test cloudflare-worker/__tests__/private-call-push.test.js
      - name: Test GitHub Pages scoped FCM Web Push and notification click
        run: node --check web/firebase-messaging-sw.js && node --check web/private_call_web_push.js && node --test web/__tests__/private_call_pwa_push.test.cjs
      - name: Test voice controls, audited updates and production readiness gating
        run: node --test cloudflare-worker/__tests__/private-voice-control.test.js
      - name: Test Firestore index deploy group scoping
        run: node --test server/__tests__/firestore-index-sync-scope.test.js
      - name: Test production R2 chat verification matches atomic image rules
        run: node --test server/__tests__/production-r2-chat-smoke-source.test.js
      - name: Test shared room-follow lookup and no-presence leakage
        run: node --test server/__tests__/room-follow-lookup.test.js
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install API integration test dependencies
        run: npm install --no-save firebase-admin@13.5.0 firebase@12.19.0 @firebase/rules-unit-testing@5.0.2
      - name: Build Firebase functions
        run: |
          npm --prefix functions install --no-audit --no-fund
          npm --prefix functions run build
      - name: Run wallet gift agency application and settlement Firestore integration tests
        run: npx --yes firebase-tools@15.1.0 emulators:exec --only firestore --project shadow-live-economy-test "node --test --test-concurrency=1 server/__tests__/store-purchase-firestore-578b.integration.test.js server/__tests__/wallet-actions.integration.test.js server/__tests__/gift-transactions.integration.test.js server/__tests__/account-deletion-erasure-checkpoint.integration.test.js server/__tests__/account-deletion-support-snapshot.integration.test.js server/__tests__/account-deletion-public-profile.integration.test.js server/__tests__/account-deletion-private-text.integration.test.js server/__tests__/account-deletion-r2-queue.integration.test.js server/__tests__/account-deletion-social-pair.integration.test.js server/__tests__/account-deletion-private-call-push-stage.integration.test.js server/__tests__/account-deletion-notification-stage.integration.test.js server/__tests__/account-deletion-processing-admission.integration.test.js server/__tests__/account-deletion-bounded-drainers.integration.test.js server/__tests__/account-deletion-internal-phase-runner.integration.test.js server/__tests__/account-deletion-diary-inventory-pages.integration.test.js server/__tests__/account-deletion-cross-diary-comment-inventory.integration.test.js server/__tests__/account-deletion-diary-interaction-inventory.integration.test.js server/__tests__/account-deletion-diary-interaction-stage.integration.test.js server/__tests__/account-deletion-diary-interaction-batches.integration.test.js server/__tests__/account-deletion-private-inventory-pages.integration.test.js server/__tests__/account-deletion-private-text-batches.integration.test.js server/__tests__/account-deletion-private-voice-inventory.integration.test.js server/__tests__/account-deletion-private-voice-r2-head.integration.test.js server/__tests__/account-deletion-private-voice-orphan-pages.integration.test.js server/__tests__/account-deletion-shared-asset-inventory-pages.integration.test.js server/__tests__/account-deletion-financial-review-pages.integration.test.js server/__tests__/account-deletion-report-evidence-review-pages.integration.test.js server/__tests__/account-deletion-image-storage-inventory.integration.test.js server/__tests__/account-deletion-image-r2-head.integration.test.js server/__tests__/account-deletion-personal-image-r2-orphan-pages.integration.test.js server/__tests__/account-deletion-image-upload-ticket-review.integration.test.js server/__tests__/agency-application.integration.test.js server/__tests__/agency-approval.integration.test.js server/__tests__/agency-rejection.integration.test.js server/__tests__/agency-membership-request.integration.test.js server/__tests__/agency-membership-commit.integration.test.js server/__tests__/agency-membership-departure.integration.test.js server/__tests__/agency-membership-cooldown.integration.test.js server/__tests__/agency-membership-cooldown-override.integration.test.js server/__tests__/agency-stage04-closure.integration.test.js server/__tests__/agency-manager-role.integration.test.js server/__tests__/agency-stage05-closure.integration.test.js server/__tests__/agency-stage06a-target-progress.integration.test.js server/__tests__/agency-stage06b-immediate-salary.integration.test.js server/__tests__/agency-stage06c-monthly-lifecycle.integration.test.js server/__tests__/agency-stage07a-share-accrual.integration.test.js server/__tests__/agency-stage07b-wallet-carryover.integration.test.js server/__tests__/agency-stage07c-concurrency-security.integration.test.js server/__tests__/agency-stage08a-bonus-core.integration.test.js server/__tests__/agency-stage08b-month-rollover-bonus.integration.test.js server/__tests__/agency-stage08c-concurrency-security.integration.test.js server/__tests__/agency-stage09a-surplus-policy.integration.test.js server/__tests__/agency-stage09b-month-end-surplus.integration.test.js server/__tests__/agency-stage09c-concurrency-security.integration.test.js server/__tests__/agency-stage10a-public-page.integration.test.js server/__tests__/agency-stage10b-public-rankings.integration.test.js server/__tests__/agency-stage11a-host-my-agency-core.integration.test.js server/__tests__/agency-stage11c-host-leave-request.integration.test.js server/__tests__/agency-stage12a-owner-dashboard.integration.test.js server/__tests__/agency-stage12b-owner-performance.integration.test.js server/__tests__/agency-stage12c-owner-management.integration.test.js server/__tests__/agency-stage13a-control-identity.integration.test.js server/__tests__/agency-stage13b-policy-controls.integration.test.js server/__tests__/agency-stage13c-safety-closure.integration.test.js server/__tests__/agency-stage15a-search.integration.test.js server/__tests__/agency-packages.integration.test.js server/__tests__/firestore-security.integration.test.js server/__tests__/diaries-lifecycle.integration.test.js server/__tests__/vip-actions.integration.test.js server/__tests__/vip-recharge-growth.integration.test.js server/__tests__/vip-room-ghost.integration.test.js server/__tests__/vip-kick-protection.integration.test.js server/__tests__/vip-hidden-entry.integration.test.js server/__tests__/vip-hide-ranking-lists.integration.test.js server/__tests__/vip4-privacy.integration.test.js server/__tests__/vip-trial-cards.integration.test.js server/__tests__/vip-frame-customization.integration.test.js server/__tests__/vip10-global-entry.integration.test.js server/__tests__/room-rocket.integration.test.js server/__tests__/reward-inventory.integration.test.js server/__tests__/cosmetic-room.integration.test.js server/__tests__/game-runtime.integration.test.js server/__tests__/game-control.integration.test.js functions/lib-test/test/game_settlement.integration.test.js"

  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Audit Dart reachability
        run: python3 .github/scripts/find_unreachable_dart.py
      - name: Upload Dart reachability
        uses: actions/upload-artifact@v4
        with:
          name: dart-reachability
          path: dart_reachability.json
          if-no-files-found: error
          retention-days: 3
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
      - name: Test
        run: flutter test

  main-tab-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-web
          path: build/web
          if-no-files-found: error
          retention-days: 3
      - name: Build E2E web
        run: flutter build web --dart-define=E2E_TEST=true
      - name: Start E2E web server
        run: |
          python3 -m http.server 8088 --directory build/web > /tmp/shadow-e2e-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8088 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shadow-e2e-server.log
          exit 1
      - name: Use runner Chrome with pinned Playwright
        timeout-minutes: 5
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          command -v google-chrome
          google-chrome --version
      - name: Run main-tab browser E2E
        run: node .github/scripts/e2e_tabs.mjs
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-tab-e2e
          path: e2e-screenshots
          if-no-files-found: warn
          retention-days: 3

  voice-room-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build voice-room E2E web
        run: |
          flutter build web --dart-define=E2E_ROOM_TEST=true --dart-define=E2E_GAME_TEST=true
          test -s build/web/assets/packages/zego_express_engine/assets/ZegoExpressWebFlutterWrapper.js
          grep -q 'src="assets/packages/zego_express_engine/assets/ZegoExpressWebFlutterWrapper.js"' build/web/index.html
      - name: Start voice-room E2E server
        run: |
          python3 -m http.server 8089 --directory build/web > /tmp/shadow-room-e2e-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8089 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shadow-room-e2e-server.log
          exit 1
      - name: Use runner Chrome with pinned Playwright
        timeout-minutes: 5
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          command -v google-chrome
          google-chrome --version
      - name: Run voice-room browser E2E
        run: node .github/scripts/e2e_voice_room.mjs
      - name: Upload voice-room E2E screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-room-e2e
          path: room-e2e-screenshots
          if-no-files-found: warn
          retention-days: 3

  shadow-control-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Shadow Control web
        run: |
          flutter build web --target lib/main_control.dart
          rm -rf build/control-web
          cp -R build/web build/control-web
      - name: Upload Shadow Control build
        uses: actions/upload-artifact@v4
        with:
          name: shadow-control-web
          path: build/control-web
          if-no-files-found: error
          retention-days: 3
      - name: Build Shadow Control E2E web
        run: flutter build web --target lib/main_control.dart --dart-define=CONTROL_E2E_TEST=true
      - name: Start Shadow Control E2E server
        run: |
          python3 -m http.server 8090 --directory build/web > /tmp/shadow-control-e2e-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8090 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shadow-control-e2e-server.log
          exit 1
      - name: Use runner Chrome with pinned Playwright
        timeout-minutes: 5
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          command -v google-chrome
          google-chrome --version
      - name: Run Shadow Control browser E2E
        run: node .github/scripts/e2e_control_rooms.mjs
      - name: Upload Shadow Control E2E screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-control-room-e2e
          path: control-e2e-screenshots
          if-no-files-found: warn
          retention-days: 3

  # Keep the original required check name as a fail-closed aggregate. A PR
  # cannot receive a green analyze-and-test unless all five groups succeed.
  analyze-and-test:
    name: analyze-and-test
    needs: [security-and-integration, flutter-quality, main-tab-browser, voice-room-browser, shadow-control-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require success from every parallel group
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | [.key, .value.result] | @tsv'
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")'
