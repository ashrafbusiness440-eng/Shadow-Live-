name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Cloudflare cutover
        run: python3 scripts/phase7_cloudflare_audit.py

      - name: Pressure regression guardrails
        run: python3 scripts/pressure_guardrail_audit.py

      - name: Audit Diaries Stage 09 pressure and security
        run: python3 scripts/diaries_stage09_audit.py

      - name: Audit Agency integration CI coverage
        run: python3 .github/scripts/audit_agency_ci_coverage.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Cloudflare Worker JavaScript syntax
        run: |
          find cloudflare-worker/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate Cloudflare Durable Object bundle
        run: |
          npm --prefix cloudflare-worker install --no-audit --no-fund
          cd cloudflare-worker
          npx wrangler deploy --dry-run --outdir ../wrangler-dry-run

      - name: Run economy, agency financial security, mic, and realtime policy unit tests
        run: node --test server/__tests__/economy-policy.test.js server/__tests__/agency-data-model.test.js server/__tests__/agency-permissions.test.js server/__tests__/agency-financial-safety.test.js server/__tests__/mic-activity.test.js server/__tests__/economy-permissions.test.js server/__tests__/room-rocket.test.js server/__tests__/game-engine.test.js server/__tests__/room-realtime-protocol.test.js server/__tests__/room-realtime-presence.test.js server/__tests__/room-realtime-game.test.js server/__tests__/auth-state-reliability.test.js server/__tests__/firestore-reliability.test.js server/__tests__/config-cache.test.js server/__tests__/pressure-telemetry.test.js server/__tests__/room-realtime-pressure.test.js server/__tests__/room-rocket-feed.test.js server/__tests__/room-root-pressure-guard.test.js server/__tests__/room-level-surfaces.test.js server/__tests__/settlement-pressure-guard.test.js server/__tests__/agency-final-ui-regression.test.js server/__tests__/system-health.test.js server/__tests__/user-storage.test.js server/__tests__/asset-studio-core.test.js server/__tests__/relationships-core.test.js server/__tests__/diaries-core.test.js server/__tests__/diary-moderation.test.js server/__tests__/admin-inbox.test.js server/__tests__/user-level-policy.test.js server/__tests__/user-level-summary.test.js server/__tests__/user-level-control.test.js server/__tests__/user-level-access.test.js server/__tests__/user-level-visibility.test.js server/__tests__/owner-absolute-room-access.test.js server/__tests__/vip-policy.test.js server/__tests__/vip-state.test.js server/__tests__/vip-level-control.test.js server/__tests__/vip-cosmetics.test.js server/__tests__/vip4-privacy-consumers.test.js server/__tests__/vip-upgrade-broadcast.test.js server/__tests__/vip-information-center.test.js server/__tests__/vip-runtime-closure.test.js server/__tests__/vip-final-closure.test.js

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install API integration test dependencies
        run: npm install --no-save firebase-admin@13.5.0 firebase@12.19.0 @firebase/rules-unit-testing@5.0.2

      - name: Build Firebase functions
        run: |
          npm --prefix functions install --no-audit --no-fund
          npm --prefix functions run build

      - name: Run wallet gift agency application and settlement Firestore integration tests
        run: npx --yes firebase-tools@15.1.0 emulators:exec --only firestore --project shadow-live-economy-test "node --test --test-concurrency=1 server/__tests__/wallet-actions.integration.test.js server/__tests__/gift-transactions.integration.test.js server/__tests__/agency-application.integration.test.js server/__tests__/agency-approval.integration.test.js server/__tests__/agency-rejection.integration.test.js server/__tests__/agency-membership-request.integration.test.js server/__tests__/agency-membership-commit.integration.test.js server/__tests__/agency-membership-departure.integration.test.js server/__tests__/agency-membership-cooldown.integration.test.js server/__tests__/agency-membership-cooldown-override.integration.test.js server/__tests__/agency-stage04-closure.integration.test.js server/__tests__/agency-manager-role.integration.test.js server/__tests__/agency-stage05-closure.integration.test.js server/__tests__/agency-stage06a-target-progress.integration.test.js server/__tests__/agency-stage06b-immediate-salary.integration.test.js server/__tests__/agency-stage06c-monthly-lifecycle.integration.test.js server/__tests__/agency-stage07a-share-accrual.integration.test.js server/__tests__/agency-stage07b-wallet-carryover.integration.test.js server/__tests__/agency-stage07c-concurrency-security.integration.test.js server/__tests__/agency-stage08a-bonus-core.integration.test.js server/__tests__/agency-stage08b-month-rollover-bonus.integration.test.js server/__tests__/agency-stage08c-concurrency-security.integration.test.js server/__tests__/agency-stage09a-surplus-policy.integration.test.js server/__tests__/agency-stage09b-month-end-surplus.integration.test.js server/__tests__/agency-stage09c-concurrency-security.integration.test.js server/__tests__/agency-stage10a-public-page.integration.test.js server/__tests__/agency-stage10b-public-rankings.integration.test.js server/__tests__/agency-stage11a-host-my-agency-core.integration.test.js server/__tests__/agency-stage11c-host-leave-request.integration.test.js server/__tests__/agency-stage12a-owner-dashboard.integration.test.js server/__tests__/agency-stage12b-owner-performance.integration.test.js server/__tests__/agency-stage12c-owner-management.integration.test.js server/__tests__/agency-stage13a-control-identity.integration.test.js server/__tests__/agency-stage13b-policy-controls.integration.test.js server/__tests__/agency-stage13c-safety-closure.integration.test.js server/__tests__/agency-stage15a-search.integration.test.js server/__tests__/agency-packages.integration.test.js server/__tests__/firestore-security.integration.test.js server/__tests__/diaries-lifecycle.integration.test.js server/__tests__/vip-actions.integration.test.js server/__tests__/vip-recharge-growth.integration.test.js server/__tests__/vip-room-ghost.integration.test.js server/__tests__/vip-kick-protection.integration.test.js server/__tests__/vip-hidden-entry.integration.test.js server/__tests__/vip-hide-ranking-lists.integration.test.js server/__tests__/vip4-privacy.integration.test.js server/__tests__/vip-trial-cards.integration.test.js server/__tests__/vip-frame-customization.integration.test.js server/__tests__/vip10-global-entry.integration.test.js server/__tests__/room-rocket.integration.test.js server/__tests__/reward-inventory.integration.test.js server/__tests__/cosmetic-room.integration.test.js server/__tests__/game-runtime.integration.test.js server/__tests__/game-control.integration.test.js functions/lib-test/test/game_settlement.integration.test.js"

      - name: Audit Dart reachability
        run: python3 .github/scripts/find_unreachable_dart.py

      - name: Upload Dart reachability
        uses: actions/upload-artifact@v4
        with:
          name: dart-reachability
          path: dart_reachability.json
          if-no-files-found: error
          retention-days: 3

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Test
        run: flutter test

      - name: Build Shadow Control web
        run: |
          flutter build web --target lib/main_control.dart
          rm -rf build/control-web
          cp -R build/web build/control-web

      - name: Upload Shadow Control build
        uses: actions/upload-artifact@v4
        with:
          name: shadow-control-web
          path: build/control-web
          if-no-files-found: error
          retention-days: 3

      - name: Build web
        run: flutter build web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-web
          path: build/web
          if-no-files-found: error
          retention-days: 3

      - name: Build E2E web
        run: flutter build web --dart-define=E2E_TEST=true

      - name: Start E2E web server
        run: |
          python3 -m http.server 8088 --directory build/web > /tmp/shadow-e2e-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8088 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shadow-e2e-server.log
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Run main-tab browser E2E
        run: node .github/scripts/e2e_tabs.mjs

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-tab-e2e
          path: e2e-screenshots
          if-no-files-found: warn
          retention-days: 3

      - name: Build voice-room E2E web
        run: flutter build web --dart-define=E2E_ROOM_TEST=true --dart-define=E2E_GAME_TEST=true

      - name: Start voice-room E2E server
        run: |
          python3 -m http.server 8089 --directory build/web > /tmp/shadow-room-e2e-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8089 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shadow-room-e2e-server.log
          exit 1

      - name: Run voice-room browser E2E
        run: node .github/scripts/e2e_voice_room.mjs

      - name: Upload voice-room E2E screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-room-e2e
          path: room-e2e-screenshots
          if-no-files-found: warn
          retention-days: 3

      - name: Build Shadow Control E2E web
        run: flutter build web --target lib/main_control.dart --dart-define=CONTROL_E2E_TEST=true

      - name: Start Shadow Control E2E server
        run: |
          python3 -m http.server 8090 --directory build/web > /tmp/shadow-control-e2e-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8090 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shadow-control-e2e-server.log
          exit 1

      - name: Run Shadow Control browser E2E
        run: node .github/scripts/e2e_control_rooms.mjs

      - name: Upload Shadow Control E2E screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-control-room-e2e
          path: control-e2e-screenshots
          if-no-files-found: warn
          retention-days: 3

  # Temporary PR-scoped production proof. Remove before merging.
  isolated-live-room-proof:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/room-presence-action-recovery-and-gift-errors-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: shadow-live-production-firestore-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded Cloudflare diagnostics
        run: npm --prefix cloudflare-worker ci --ignore-scripts --no-audit --no-fund
      - name: Exercise actual live two-user room and gift API
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALLOW_PRODUCTION_DURABLE_OBJECT_E2E: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          (cd cloudflare-worker && timeout 45s npx wrangler tail shadow-live --format json --ip self > /tmp/shadow-ticket-diagnostic.jsonl 2>/tmp/shadow-ticket-tail-error.txt) &
          tail_pid=$!
          sleep 8
          node cloudflare-worker/scripts/room-gift-e2e.mjs
          test_status=$?
          sleep 3
          kill "$tail_pid" 2>/dev/null || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=fs.existsSync('/tmp/shadow-ticket-diagnostic.jsonl')
            ?fs.readFileSync('/tmp/shadow-ticket-diagnostic.jsonl','utf8'):'';
          let count=0;
          for(const line of raw.split('\n')){
            try{
              const entry=JSON.parse(line);
              const path=String(entry?.event?.request?.url || '').split('?')[0];
              if(!path.endsWith('/api/room-realtime'))continue;
              count++;
              const exceptions=Array.isArray(entry?.exceptions)?entry.exceptions:[];
              for(const exception of exceptions.slice(0,3)){
                const name=String(exception?.name || '').slice(0,40);
                const message=String(exception?.message || '').replace(/[\r\n]/g,' ').slice(0,210);
                console.log('ROOM_TICKET_EXCEPTION',name,message);
              }
              console.log('ROOM_TICKET_OUTCOME',String(entry?.outcome || 'unknown'));
            }catch{}
          }
          console.log('ROOM_TICKET_DIAGNOSTIC_EVENTS',count);
          const errorFile='/tmp/shadow-ticket-tail-error.txt';
          if(count===0 && fs.existsSync(errorFile)){
            console.log('ROOM_TICKET_TAIL_STATUS',
              fs.readFileSync(errorFile,'utf8').split('\n')
                .filter(line=>/error|denied|permission|Failed/i.test(line)).slice(-3)
                .map(line=>line.replace(/\s+/g,' ').slice(0,150)).join(' | '));
          }
          NODE
          exit "$test_status"
      - name: Exercise actual live chat and diary gift API
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/chat-gift-e2e.mjs
