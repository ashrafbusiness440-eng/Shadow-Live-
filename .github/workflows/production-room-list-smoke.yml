name: Production Room List Rules Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-room-list-smoke.yml'
      - 'firestore.rules'
      - 'server/__tests__/firestore-security.integration.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  room-list-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase Admin for smoke
        run: npm install --no-save --ignore-scripts firebase-admin@^13
      - name: Query production rooms through Firebase Auth and Firestore Rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const admin = require('firebase-admin');

          let serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (typeof serviceAccount === 'string') serviceAccount = JSON.parse(serviceAccount);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });

          const uid = 'ci-room-list-rules-smoke';
          const customToken = await admin.auth().createCustomToken(uid);

          const options = fs.readFileSync('lib/firebase_options.dart', 'utf8');
          const match = options.match(/apiKey:\s*'([^']+)'/);
          if (!match) throw new Error('firebase_web_api_key_not_found');
          const apiKey = match[1];

          const signIn = await fetch(
            'https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=' + encodeURIComponent(apiKey),
            {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ token: customToken, returnSecureToken: true }),
            },
          );
          const signInBody = await signIn.json();
          if (!signIn.ok || !signInBody.idToken) {
            throw new Error('custom_token_exchange_failed:' + signIn.status);
          }

          const queryResponse = await fetch(
            'https://firestore.googleapis.com/v1/projects/shadow-live/databases/(default)/documents:runQuery',
            {
              method: 'POST',
              headers: {
                authorization: 'Bearer ' + signInBody.idToken,
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                structuredQuery: {
                  from: [{ collectionId: 'rooms' }],
                  limit: 60,
                },
              }),
            },
          );
          const body = await queryResponse.text();
          if (!queryResponse.ok) {
            console.error('PRODUCTION_ROOM_LIST_QUERY_FAILED', queryResponse.status, body);
            process.exit(1);
          }
          const rows = JSON.parse(body);
          const docs = rows.filter((row) => row.document).length;
          console.log('PRODUCTION_ROOM_LIST_QUERY_OK docs=' + docs);
          NODE
