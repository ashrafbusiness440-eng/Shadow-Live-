name: Deploy Shadow Live API to Cloudflare Workers
# Asset token verification marker
# ZEGO secret sync verification marker
# Secret sync verification marker
# Game RNG sync verification marker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Firebase service account secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
          else
            echo "FIREBASE_SERVICE_ACCOUNT is not configured in GitHub yet; skipping secret sync."
          fi

      - name: Sync ZEGO credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZEGO_APP_ID: ${{ secrets.ZEGO_APP_ID }}
          ZEGO_SERVER_SECRET: ${{ secrets.ZEGO_SERVER_SECRET }}
        run: |
          if [ -n "$ZEGO_APP_ID" ]; then
            printf '%s' "$ZEGO_APP_ID" | npx wrangler secret put ZEGO_APP_ID
          else
            echo "ZEGO_APP_ID is not configured in GitHub yet; skipping."
          fi
          if [ -n "$ZEGO_SERVER_SECRET" ]; then
            printf '%s' "$ZEGO_SERVER_SECRET" | npx wrangler secret put ZEGO_SERVER_SECRET
          else
            echo "ZEGO_SERVER_SECRET is not configured in GitHub yet; skipping."
          fi

      - name: Sync Google Play service account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT" ]; then
            printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT" | npx wrangler secret put GOOGLE_PLAY_SERVICE_ACCOUNT
          else
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT is not configured yet; Firebase service account fallback remains active."
          fi

      - name: Sync GitHub asset token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHADOW_ASSET_GITHUB_TOKEN: ${{ secrets.SHADOW_ASSET_GITHUB_TOKEN }}
        run: |
          if [ -n "$SHADOW_ASSET_GITHUB_TOKEN" ]; then
            printf '%s' "$SHADOW_ASSET_GITHUB_TOKEN" | npx wrangler secret put GITHUB_ASSET_TOKEN
          else
            echo "SHADOW_ASSET_GITHUB_TOKEN is not configured in GitHub yet; skipping."
          fi

      - name: Sync R2 presign credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 presign credentials are missing from GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID
          printf '%s' "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY

      - name: Sync game RNG secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAME_RNG_SECRET: ${{ secrets.GAME_RNG_SECRET }}
        run: |
          if [ -n "$GAME_RNG_SECRET" ]; then
            printf '%s' "$GAME_RNG_SECRET" | npx wrangler secret put GAME_RNG_SECRET
          else
            echo "GAME_RNG_SECRET is not configured in GitHub yet; real game betting remains blocked."
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var BUILD_SHA:"$GITHUB_SHA" --var R2_ACCOUNT_ID:"$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify Worker health
        run: |
          for ATTEMPT in $(seq 1 15); do
            TMP=$(mktemp)
            STATUS=$(curl --silent --show-error --output "$TMP" --write-out '%{http_code}' \
              https://shadow-live.ashraf-business-440.workers.dev/health || true)
            BODY=$(cat "$TMP")
            rm -f "$TMP"
            echo "$BODY"
            if [ "$STATUS" = "429" ]; then
              echo "::error::Cloudflare Worker request quota/rate limit is active; stopping health retries to avoid more traffic."
              exit 1
            fi
            if [ "$STATUS" = "200" ] && echo "$BODY" | grep -q '"ok":true' && \
               echo "$BODY" | grep -q "\"buildSha\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            if [ "$ATTEMPT" = "15" ]; then
              echo "Latest Worker version did not become active."
              exit 1
            fi
            sleep 2
          done

      - name: Check R2 storage health
        run: |
          BODY=$(curl --silent --show-error \
            https://shadow-live.ashraf-business-440.workers.dev/api/storage-health || true)
          echo "$BODY"
          if echo "$BODY" | grep -q '"ok":true'; then
            echo "Cloudflare R2 storage is ready."
          else
            echo "::warning::Cloudflare R2 storage is not currently ready; deployment remains valid."
          fi


      - name: Install production storage smoke dependency
        run: npm install --no-save --ignore-scripts firebase-admin@^13

      - name: Verify production R2 profile upload route
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import admin from "firebase-admin";

          let serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || "{}");
          if (typeof serviceAccount === "string") serviceAccount = JSON.parse(serviceAccount);
          if (!serviceAccount.project_id || !serviceAccount.client_email || !serviceAccount.private_key) {
            throw new Error("invalid_firebase_service_account");
          }

          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });

          const uid = "ci-r2-profile-" + Date.now();
          const workerBase = "https://shadow-live.ashraf-business-440.workers.dev/api";
          let idToken = "";
          let objectId = "";

          const callStorage = async (payload) => {
            const response = await fetch(workerBase + "/user-storage", {
              method: "POST",
              headers: {
                authorization: "Bearer " + idToken,
                "content-type": "application/json",
              },
              body: JSON.stringify(payload),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.ok !== true) {
              throw new Error(
                "storage_api_failed:" + response.status + ":" + JSON.stringify(body),
              );
            }
            return body;
          };

          try {
            const customToken = await admin.auth().createCustomToken(uid);
            const options = fs.readFileSync("../lib/firebase_options.dart", "utf8");
            const apiKeyMatch = options.match(/apiKey:\s*'([^']+)'/);
            if (!apiKeyMatch) throw new Error("firebase_web_api_key_not_found");

            const signIn = await fetch(
              "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=" +
                encodeURIComponent(apiKeyMatch[1]),
              {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ token: customToken, returnSecureToken: true }),
              },
            );
            const signInBody = await signIn.json().catch(() => ({}));
            if (!signIn.ok || !signInBody.idToken) {
              throw new Error(
                "custom_token_exchange_failed:" +
                  signIn.status +
                  ":" +
                  JSON.stringify(signInBody),
              );
            }
            idToken = signInBody.idToken;

            const payload = new Uint8Array([
              0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a,
            ]);
            const prepared = await callStorage({
              action: "prepareUpload",
              scope: "profile_image",
              mimeType: "image/png",
              byteLength: payload.length,
            });
            objectId = String(prepared.objectId || "");
            if (!objectId || !prepared.uploadUrl) {
              throw new Error("storage_prepare_invalid");
            }

            const upload = await fetch(prepared.uploadUrl, {
              method: "PUT",
              headers: { "content-type": "image/png" },
              body: payload,
            });
            if (!upload.ok) {
              throw new Error("r2_direct_put_failed:" + upload.status);
            }

            const confirmed = await callStorage({
              action: "confirmUpload",
              objectId,
            });
            const publicUrl = String(confirmed.publicUrl || "");
            if (!publicUrl.includes("/api/public-media/profile_image/")) {
              throw new Error("public_media_url_missing");
            }

            const redirect = await fetch(publicUrl, { redirect: "manual" });
            if (redirect.status !== 302 || !redirect.headers.get("location")) {
              throw new Error("public_media_redirect_failed:" + redirect.status);
            }

            const publicRead = await fetch(publicUrl);
            if (!publicRead.ok) {
              throw new Error("public_media_read_failed:" + publicRead.status);
            }
            const received = new Uint8Array(await publicRead.arrayBuffer());
            if (
              received.length !== payload.length ||
              received.some((value, index) => value !== payload[index])
            ) {
              throw new Error("public_media_roundtrip_mismatch");
            }

            const deletion = await fetch(
              workerBase + "/user-storage?objectId=" + encodeURIComponent(objectId),
              {
                method: "DELETE",
                headers: { authorization: "Bearer " + idToken },
              },
            );
            const deletionBody = await deletion.json().catch(() => ({}));
            if (!deletion.ok || deletionBody.deleted !== true) {
              throw new Error(
                "storage_delete_failed:" +
                  deletion.status +
                  ":" +
                  JSON.stringify(deletionBody),
              );
            }
            objectId = "";
            console.log("R2_PROFILE_PRODUCTION_E2E_OK");
          } finally {
            if (objectId && idToken) {
              await fetch(
                workerBase + "/user-storage?objectId=" + encodeURIComponent(objectId),
                {
                  method: "DELETE",
                  headers: { authorization: "Bearer " + idToken },
                },
              ).catch(() => {});
            }
            await admin.auth().deleteUser(uid).catch(() => {});
          }
          NODE
