name: Deploy Shadow Live API to Cloudflare Workers
# Asset token verification marker
# ZEGO secret sync verification marker
# Secret sync verification marker
# Game RNG sync verification marker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Firebase service account secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
          else
            echo "FIREBASE_SERVICE_ACCOUNT is not configured in GitHub yet; skipping secret sync."
          fi

      - name: Sync ZEGO credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZEGO_APP_ID: ${{ secrets.ZEGO_APP_ID }}
          ZEGO_SERVER_SECRET: ${{ secrets.ZEGO_SERVER_SECRET }}
        run: |
          if [ -n "$ZEGO_APP_ID" ]; then
            printf '%s' "$ZEGO_APP_ID" | npx wrangler secret put ZEGO_APP_ID
          else
            echo "ZEGO_APP_ID is not configured in GitHub yet; skipping."
          fi
          if [ -n "$ZEGO_SERVER_SECRET" ]; then
            printf '%s' "$ZEGO_SERVER_SECRET" | npx wrangler secret put ZEGO_SERVER_SECRET
          else
            echo "ZEGO_SERVER_SECRET is not configured in GitHub yet; skipping."
          fi

      - name: Sync Google Play service account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT" ]; then
            printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT" | npx wrangler secret put GOOGLE_PLAY_SERVICE_ACCOUNT
          else
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT is not configured yet; Firebase service account fallback remains active."
          fi

      - name: Sync GitHub asset token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHADOW_ASSET_GITHUB_TOKEN: ${{ secrets.SHADOW_ASSET_GITHUB_TOKEN }}
        run: |
          if [ -n "$SHADOW_ASSET_GITHUB_TOKEN" ]; then
            printf '%s' "$SHADOW_ASSET_GITHUB_TOKEN" | npx wrangler secret put GITHUB_ASSET_TOKEN
          else
            echo "SHADOW_ASSET_GITHUB_TOKEN is not configured in GitHub yet; skipping."
          fi

      - name: Sync R2 presign credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 presign credentials are missing from GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID
          printf '%s' "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY

      - name: Sync game RNG secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAME_RNG_SECRET: ${{ secrets.GAME_RNG_SECRET }}
        run: |
          if [ -n "$GAME_RNG_SECRET" ]; then
            printf '%s' "$GAME_RNG_SECRET" | npx wrangler secret put GAME_RNG_SECRET
          else
            echo "GAME_RNG_SECRET is not configured in GitHub yet; real game betting remains blocked."
          fi

      - name: Sync Pressure Analytics read credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare analytics credentials are missing."
            exit 1
          fi
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put PRESSURE_ANALYTICS_READ_TOKEN
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put PRESSURE_ANALYTICS_ACCOUNT_ID

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var BUILD_SHA:"$GITHUB_SHA" --var R2_ACCOUNT_ID:"$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify Worker health
        run: |
          for ATTEMPT in $(seq 1 15); do
            TMP=$(mktemp)
            STATUS=$(curl --silent --show-error --output "$TMP" --write-out '%{http_code}' \
              https://shadow-live.ashraf-business-440.workers.dev/health || true)
            BODY=$(cat "$TMP")
            rm -f "$TMP"
            echo "$BODY"
            if [ "$STATUS" = "429" ]; then
              echo "::error::Cloudflare Worker request quota/rate limit is active; stopping health retries to avoid more traffic."
              exit 1
            fi
            if [ "$STATUS" = "200" ] && echo "$BODY" | grep -q '"ok":true' && \
               echo "$BODY" | grep -q "\"buildSha\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            if [ "$ATTEMPT" = "15" ]; then
              echo "Latest Worker version did not become active."
              exit 1
            fi
            sleep 2
          done

      - name: Check R2 storage health
        run: |
          BODY=$(curl --silent --show-error \
            https://shadow-live.ashraf-business-440.workers.dev/api/storage-health || true)
          echo "$BODY"
          if echo "$BODY" | grep -q '"ok":true'; then
            echo "Cloudflare R2 storage is ready."
          else
            echo "::warning::Cloudflare R2 storage is not currently ready; deployment remains valid."
          fi


      - name: Install production storage smoke dependency
        run: npm install --no-save --ignore-scripts firebase-admin@^13

      - name: Verify production R2 profile upload route
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import admin from "firebase-admin";

          let serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || "{}");
          if (typeof serviceAccount === "string") serviceAccount = JSON.parse(serviceAccount);
          if (!serviceAccount.project_id || !serviceAccount.client_email || !serviceAccount.private_key) {
            throw new Error("invalid_firebase_service_account");
          }

          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });

          const uid = "ci-r2-profile-" + Date.now();
          const workerBase = "https://shadow-live.ashraf-business-440.workers.dev/api";
          let idToken = "";
          let objectId = "";

          const callStorage = async (payload) => {
            const response = await fetch(workerBase + "/user-storage", {
              method: "POST",
              headers: {
                authorization: "Bearer " + idToken,
                "content-type": "application/json",
              },
              body: JSON.stringify(payload),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.ok !== true) {
              throw new Error(
                "storage_api_failed:" + response.status + ":" + JSON.stringify(body),
              );
            }
            return body;
          };

          try {
            const customToken = await admin.auth().createCustomToken(uid);
            const options = fs.readFileSync("../lib/firebase_options.dart", "utf8");
            const apiKeyMatch = options.match(/apiKey:\s*'([^']+)'/);
            if (!apiKeyMatch) throw new Error("firebase_web_api_key_not_found");

            const signIn = await fetch(
              "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=" +
                encodeURIComponent(apiKeyMatch[1]),
              {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ token: customToken, returnSecureToken: true }),
              },
            );
            const signInBody = await signIn.json().catch(() => ({}));
            if (!signIn.ok || !signInBody.idToken) {
              throw new Error(
                "custom_token_exchange_failed:" +
                  signIn.status +
                  ":" +
                  JSON.stringify(signInBody),
              );
            }
            idToken = signInBody.idToken;

            const payload = new Uint8Array([
              0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a,
            ]);
            const prepared = await callStorage({
              action: "prepareUpload",
              scope: "profile_image",
              mimeType: "image/png",
              byteLength: payload.length,
            });
            objectId = String(prepared.objectId || "");
            if (!objectId || !prepared.uploadUrl) {
              throw new Error("storage_prepare_invalid");
            }

            const upload = await fetch(prepared.uploadUrl, {
              method: "PUT",
              headers: { "content-type": "image/png" },
              body: payload,
            });
            if (!upload.ok) {
              throw new Error("r2_direct_put_failed:" + upload.status);
            }

            const confirmed = await callStorage({
              action: "confirmUpload",
              objectId,
            });
            const publicUrl = String(confirmed.publicUrl || "");
            if (!publicUrl.includes("/api/public-media/profile_image/")) {
              throw new Error("public_media_url_missing");
            }

            const publicRead = await fetch(publicUrl, {
              headers: {
                Origin: "https://ashrafbusiness440-eng.github.io",
              },
            });
            if (!publicRead.ok) {
              throw new Error("public_media_read_failed:" + publicRead.status);
            }
            if (publicRead.status !== 200 || publicRead.headers.get("location")) {
              throw new Error(
                "public_media_should_stream_directly:" + publicRead.status,
              );
            }
            if (
              publicRead.headers.get("access-control-allow-origin") !==
              "https://ashrafbusiness440-eng.github.io"
            ) {
              throw new Error("public_media_pwa_cors_missing");
            }
            if (
              !(publicRead.headers.get("content-type") || "")
                .toLowerCase()
                .startsWith("image/png")
            ) {
              throw new Error("public_media_content_type_invalid");
            }
            const received = new Uint8Array(await publicRead.arrayBuffer());
            if (
              received.length !== payload.length ||
              received.some((value, index) => value !== payload[index])
            ) {
              throw new Error("public_media_roundtrip_mismatch");
            }

            const deletion = await fetch(
              workerBase + "/user-storage?objectId=" + encodeURIComponent(objectId),
              {
                method: "DELETE",
                headers: { authorization: "Bearer " + idToken },
              },
            );
            const deletionBody = await deletion.json().catch(() => ({}));
            if (!deletion.ok || deletionBody.deleted !== true) {
              throw new Error(
                "storage_delete_failed:" +
                  deletion.status +
                  ":" +
                  JSON.stringify(deletionBody),
              );
            }
            objectId = "";
            console.log("R2_PROFILE_PRODUCTION_E2E_OK");
          } finally {
            if (objectId && idToken) {
              await fetch(
                workerBase + "/user-storage?objectId=" + encodeURIComponent(objectId),
                {
                  method: "DELETE",
                  headers: { authorization: "Bearer " + idToken },
                },
              ).catch(() => {});
            }
            await admin.auth().deleteUser(uid).catch(() => {});
          }
          NODE


      - name: Verify production R2 room cover and two-account chat permissions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import admin from "firebase-admin";

          let serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || "{}");
          if (typeof serviceAccount === "string") serviceAccount = JSON.parse(serviceAccount);
          if (!serviceAccount.project_id || !serviceAccount.client_email || !serviceAccount.private_key) {
            throw new Error("invalid_firebase_service_account");
          }

          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const db = admin.firestore();
          const stamp = Date.now();
          const uidA = "ci-r2-owner-" + stamp;
          const uidB = "ci-r2-peer-" + stamp;
          const conversationId = "ci_r2_chat_" + stamp;
          const workerBase = "https://shadow-live.ashraf-business-440.workers.dev/api";
          const payload = new Uint8Array([
            0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a,
          ]);
          let tokenA = "";
          let tokenB = "";
          let roomId = "";
          let roomPublicId = "";
          let roomObjectId = "";
          let chatObjectId = "";
          let chatMessageId = "";

          const options = fs.readFileSync("../lib/firebase_options.dart", "utf8");
          const apiKeyMatch = options.match(/apiKey:\s*'([^']+)'/);
          if (!apiKeyMatch) throw new Error("firebase_web_api_key_not_found");
          const apiKey = apiKeyMatch[1];

          const signIn = async (uid) => {
            const customToken = await admin.auth().createCustomToken(uid);
            const response = await fetch(
              "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=" +
                encodeURIComponent(apiKey),
              {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ token: customToken, returnSecureToken: true }),
              },
            );
            const body = await response.json().catch(() => ({}));
            if (!response.ok || !body.idToken) {
              throw new Error(
                "custom_token_exchange_failed:" +
                  response.status +
                  ":" +
                  JSON.stringify(body),
              );
            }
            return body.idToken;
          };

          const storageCall = async (token, payloadBody) => {
            const response = await fetch(workerBase + "/user-storage", {
              method: "POST",
              headers: {
                authorization: "Bearer " + token,
                "content-type": "application/json",
              },
              body: JSON.stringify(payloadBody),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.ok !== true) {
              throw new Error(
                "storage_api_failed:" + response.status + ":" + JSON.stringify(body),
              );
            }
            return body;
          };

          const storageRawCall = async (token, payloadBody) => {
            const response = await fetch(workerBase + "/user-storage", {
              method: "POST",
              headers: {
                authorization: "Bearer " + token,
                "content-type": "application/json",
              },
              body: JSON.stringify(payloadBody),
            });
            const body = await response.json().catch(() => ({}));
            return { response, body };
          };

          const voiceCall = async (token, payloadBody) => {
            const response = await fetch(workerBase + "/voice-session", {
              method: "POST",
              headers: {
                authorization: "Bearer " + token,
                "content-type": "application/json",
              },
              body: JSON.stringify(payloadBody),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.ok !== true) {
              throw new Error(
                "voice_api_failed:" + response.status + ":" + JSON.stringify(body),
              );
            }
            return body;
          };

          const directUpload = async (token, scope, targetId) => {
            const prepared = await storageCall(token, {
              action: "prepareUpload",
              scope,
              mimeType: "image/png",
              byteLength: payload.length,
              ...(targetId ? { targetId } : {}),
            });
            const objectId = String(prepared.objectId || "");
            if (!objectId || !prepared.uploadUrl) throw new Error("storage_prepare_invalid");

            const put = await fetch(prepared.uploadUrl, {
              method: "PUT",
              headers: { "content-type": "image/png" },
              body: payload,
            });
            if (!put.ok) throw new Error("r2_direct_put_failed:" + put.status);

            const confirmed = await storageCall(token, {
              action: "confirmUpload",
              objectId,
            });
            return { objectId, confirmed };
          };

          const deleteObject = async (token, objectId) => {
            const response = await fetch(
              workerBase + "/user-storage?objectId=" + encodeURIComponent(objectId),
              {
                method: "DELETE",
                headers: { authorization: "Bearer " + token },
              },
            );
            const body = await response.json().catch(() => ({}));
            return { response, body };
          };

          try {
            await Promise.all([
              db.collection("users").doc(uidA).set({
                displayName: "R2 Owner",
                role: "user",
                accountStatus: "active",
                location: "UAE",
              }),
              db.collection("users").doc(uidB).set({
                displayName: "R2 Peer",
                role: "user",
                accountStatus: "active",
                location: "UAE",
              }),
            ]);
            [tokenA, tokenB] = await Promise.all([signIn(uidA), signIn(uidB)]);

            const invalidMime = await storageRawCall(tokenA, {
              action: "prepareUpload",
              scope: "profile_image",
              mimeType: "image/gif",
              byteLength: payload.length,
            });
            if (
              invalidMime.response.status !== 400 ||
              invalidMime.body.code !== "gif_profile_only"
            ) {
              throw new Error(
                "invalid_mime_should_be_rejected:" +
                  invalidMime.response.status +
                  ":" +
                  JSON.stringify(invalidMime.body),
              );
            }

            const oversized = await storageRawCall(tokenA, {
              action: "prepareUpload",
              scope: "profile_image",
              mimeType: "image/png",
              byteLength: 2 * 1024 * 1024 + 1,
            });
            if (
              oversized.response.status !== 400 ||
              oversized.body.code !== "invalid_file_size"
            ) {
              throw new Error(
                "oversized_upload_should_be_rejected:" +
                  oversized.response.status +
                  ":" +
                  JSON.stringify(oversized.body),
              );
            }
            console.log("R2_INVALID_MIME_AND_OVERSIZE=REJECTED");

            const personal = await voiceCall(tokenA, { action: "personalRoom" });
            const room = personal.room || {};
            roomId = String(room.roomId || "");
            roomPublicId = String(room.publicId || "");
            if (!roomId) throw new Error("personal_room_missing");

            const roomUpload = await directUpload(tokenA, "room_cover", roomId);
            roomObjectId = roomUpload.objectId;
            const roomCoverUrl = String(roomUpload.confirmed.publicUrl || "");
            if (!roomCoverUrl.includes("/api/public-media/room_cover/")) {
              throw new Error("room_cover_public_url_missing");
            }

            const updatedRoom = await voiceCall(tokenA, {
              action: "updateRoomSettings",
              roomId,
              name: String(room.name || "R2 Room"),
              description: String(room.description || ""),
              category: String(room.category || "دردشة"),
              tags: Array.isArray(room.tags) ? room.tags : [],
              visibility: "public",
              chatEnabled: true,
              coverImageUrl: roomCoverUrl,
              coverImageObjectId: roomObjectId,
            });
            if (String(updatedRoom?.room?.coverImageObjectId || "") !== roomObjectId) {
              throw new Error("room_cover_object_not_persisted");
            }

            const publicRead = await fetch(roomCoverUrl);
            if (!publicRead.ok) throw new Error("room_cover_read_failed:" + publicRead.status);
            const roomBytes = new Uint8Array(await publicRead.arrayBuffer());
            if (
              roomBytes.length !== payload.length ||
              roomBytes.some((value, index) => value !== payload[index])
            ) {
              throw new Error("room_cover_roundtrip_mismatch");
            }

            await db.collection("conversations").doc(conversationId).set({
              participants: [uidA, uidB],
              createdAt: new Date(),
              updatedAt: new Date(),
              unreadCounts: { [uidA]: 0, [uidB]: 0 },
            });

            const nonMutualUpload = await storageRawCall(tokenA, {
              action: "prepareUpload",
              scope: "chat_image",
              mimeType: "image/png",
              byteLength: payload.length,
              targetId: conversationId,
            });
            if (
              nonMutualUpload.response.status !== 403 ||
              nonMutualUpload.body.code !== "follow_required"
            ) {
              throw new Error(
                "non_mutual_chat_upload_should_be_rejected:" +
                  nonMutualUpload.response.status +
                  ":" +
                  JSON.stringify(nonMutualUpload.body),
              );
            }
            console.log("R2_CHAT_NON_MUTUAL_UPLOAD=REJECTED");

            await Promise.all([
              db.collection("follows").doc(uidA + "__" + uidB).set({
                fromUid: uidA,
                toUid: uidB,
                createdAt: new Date(),
              }),
              db.collection("follows").doc(uidB + "__" + uidA).set({
                fromUid: uidB,
                toUid: uidA,
                createdAt: new Date(),
              }),
            ]);

            await db.collection("user_blocks").doc(uidA)
              .collection("items").doc(uidB).set({
                blockedUid: uidB,
                createdAt: new Date(),
              });
            const blockedUpload = await storageRawCall(tokenA, {
              action: "prepareUpload",
              scope: "chat_image",
              mimeType: "image/png",
              byteLength: payload.length,
              targetId: conversationId,
            });
            if (
              blockedUpload.response.status !== 403 ||
              blockedUpload.body.code !== "blocked"
            ) {
              throw new Error(
                "blocked_chat_upload_should_be_rejected:" +
                  blockedUpload.response.status +
                  ":" +
                  JSON.stringify(blockedUpload.body),
              );
            }
            await db.collection("user_blocks").doc(uidA)
              .collection("items").doc(uidB).delete();
            console.log("R2_CHAT_BLOCKED_UPLOAD=REJECTED");

            const chatUpload = await directUpload(tokenA, "chat_image", conversationId);
            chatObjectId = chatUpload.objectId;
            if (chatUpload.confirmed.publicUrl) {
              throw new Error("private_chat_object_exposed_publicly");
            }

            chatMessageId = "r2_" + stamp;
            const messageResponse = await fetch(
              "https://firestore.googleapis.com/v1/projects/" +
                encodeURIComponent(serviceAccount.project_id) +
                "/databases/(default)/documents/conversations/" +
                encodeURIComponent(conversationId) +
                "/messages/" +
                encodeURIComponent(chatMessageId),
              {
                method: "PATCH",
                headers: {
                  authorization: "Bearer " + tokenA,
                  "content-type": "application/json",
                },
                body: JSON.stringify({
                  fields: {
                    senderId: { stringValue: uidA },
                    receiverId: { stringValue: uidB },
                    type: { stringValue: "image" },
                    storageObjectId: { stringValue: chatObjectId },
                    mimeType: { stringValue: "image/png" },
                    sizeBytes: { integerValue: String(payload.length) },
                    createdAt: { timestampValue: new Date().toISOString() },
                  },
                }),
              },
            );
            const messageBody = await messageResponse.text();
            if (!messageResponse.ok) {
              throw new Error(
                "production_chat_rules_rejected:" +
                  messageResponse.status +
                  ":" +
                  messageBody.slice(0, 300),
              );
            }

            const peerRead = await storageCall(tokenB, {
              action: "prepareRead",
              objectId: chatObjectId,
            });
            const peerFetch = await fetch(String(peerRead.readUrl || ""));
            if (!peerFetch.ok) throw new Error("peer_chat_read_failed:" + peerFetch.status);
            const peerBytes = new Uint8Array(await peerFetch.arrayBuffer());
            if (
              peerBytes.length !== payload.length ||
              peerBytes.some((value, index) => value !== payload[index])
            ) {
              throw new Error("peer_chat_roundtrip_mismatch");
            }

            const deniedDelete = await deleteObject(tokenB, chatObjectId);
            if (
              deniedDelete.response.status !== 403 ||
              deniedDelete.body.code !== "forbidden"
            ) {
              throw new Error(
                "peer_delete_should_be_forbidden:" +
                  deniedDelete.response.status +
                  ":" +
                  JSON.stringify(deniedDelete.body),
              );
            }

            const chatDelete = await deleteObject(tokenA, chatObjectId);
            if (!chatDelete.response.ok || chatDelete.body.deleted !== true) {
              throw new Error("owner_chat_delete_failed");
            }
            chatObjectId = "";

            await voiceCall(tokenA, {
              action: "updateRoomSettings",
              roomId,
              name: String(room.name || "R2 Room"),
              description: String(room.description || ""),
              category: String(room.category || "دردشة"),
              tags: Array.isArray(room.tags) ? room.tags : [],
              visibility: "public",
              chatEnabled: true,
              coverImageUrl: "",
              coverImageObjectId: "",
            });
            const roomDelete = await deleteObject(tokenA, roomObjectId);
            if (!roomDelete.response.ok || roomDelete.body.deleted !== true) {
              throw new Error("owner_room_cover_delete_failed");
            }
            roomObjectId = "";

            console.log("R2_ROOM_CHAT_TWO_ACCOUNT_E2E_OK");
          } finally {
            if (chatObjectId && tokenA) {
              await deleteObject(tokenA, chatObjectId).catch(() => {});
            }
            if (roomObjectId && tokenA) {
              if (roomId) {
                await voiceCall(tokenA, {
                  action: "updateRoomSettings",
                  roomId,
                  name: "R2 Room",
                  description: "",
                  category: "دردشة",
                  tags: [],
                  visibility: "public",
                  chatEnabled: true,
                  coverImageUrl: "",
                  coverImageObjectId: "",
                }).catch(() => {});
              }
              await deleteObject(tokenA, roomObjectId).catch(() => {});
            }

            if (chatMessageId) {
              await db.collection("conversations").doc(conversationId)
                .collection("messages").doc(chatMessageId).delete().catch(() => {});
            }
            await Promise.all([
              db.collection("conversations").doc(conversationId).delete().catch(() => {}),
              db.collection("follows").doc(uidA + "__" + uidB).delete().catch(() => {}),
              db.collection("follows").doc(uidB + "__" + uidA).delete().catch(() => {}),
              db.collection("user_blocks").doc(uidA)
                .collection("items").doc(uidB).delete().catch(() => {}),
              db.collection("user_blocks").doc(uidB)
                .collection("items").doc(uidA).delete().catch(() => {}),
            ]);

            if (roomId) {
              await db.collection("rooms").doc(roomId).delete().catch(() => {});
            }
            if (roomPublicId) {
              await db.collection("room_ids").doc(roomPublicId).delete().catch(() => {});
            }
            await Promise.all([
              db.collection("users").doc(uidA).delete().catch(() => {}),
              db.collection("users").doc(uidB).delete().catch(() => {}),
              admin.auth().deleteUser(uidA).catch(() => {}),
              admin.auth().deleteUser(uidB).catch(() => {}),
            ]);

            for (const uid of [uidA, uidB]) {
              const audits = await db.collection("storage_audit_logs")
                .where("actorUid", "==", uid)
                .get()
                .catch(() => null);
              if (audits && !audits.empty) {
                const batch = db.batch();
                for (const doc of audits.docs) batch.delete(doc.ref);
                await batch.commit().catch(() => {});
              }
            }
          }
          NODE

      - name: Verify production System Health thresholds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ../scripts/pressure_system_health_e2e.mjs

      - name: Measure Step 12 first seven after deploy
        working-directory: .
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WINDOW_MINUTES: '1440'
          PRESSURE_DATASET: shadow_live_pressure_v1
        run: |
          sleep 15
          node cloudflare-worker/scripts/pressure-report.mjs
          node scripts/pressure_listener_budget_audit.mjs
          node scripts/pressure_step12_first7_audit.mjs pressure-report.json listener-budget.json

      - name: Upload post-deploy Step 12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step12-first7-production
          path: |
            pressure-report.json
            pressure-report.md
            listener-budget.json
            listener-budget.md
            step12-first7-closure.json
            step12-first7-closure.md
          if-no-files-found: warn
          retention-days: 30
