name: Temporary Gift Ranking Diagnostics
on:
  push:
    branches: [fix/gift-ranking-aggregation-live-diagnostics-20261027]
    paths:
      - '.github/workflows/temporary-gift-ranking-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check diagnostics script syntax
        run: node --check cloudflare-worker/scripts/verify-gift-ranking-index.mjs
      - name: Run read-only index query diagnostics
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/verify-gift-ranking-index.mjs
