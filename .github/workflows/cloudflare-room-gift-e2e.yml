name: Cloudflare Room Gift E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-production-firestore-e2e
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Cloudflare Room Gift E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALLOW_PRODUCTION_DURABLE_OBJECT_E2E: '1'
        run: node cloudflare-worker/scripts/room-gift-e2e.mjs
