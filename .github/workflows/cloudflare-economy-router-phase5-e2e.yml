name: Cloudflare Economy Router Phase 5 E2E

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/src/economy-router.js'
      - 'cloudflare-worker/src/economy-router-legacy.js'
      - 'cloudflare-worker/src/legacy-economy/**'
      - 'cloudflare-worker/src/legacy-games/**'
      - 'cloudflare-worker/scripts/economy-router-e2e.mjs'
      - '.github/workflows/cloudflare-economy-router-phase5-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-cloudflare-economy-router-phase5-e2e
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact Cloudflare build when Worker changed
        run: |
          CHANGED=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          if ! echo "$CHANGED" | grep -Eq '^cloudflare-worker/(src|wrangler\.toml)'; then
            echo "Worker source unchanged in this commit; using current deployed Worker."
            exit 0
          fi
          for ATTEMPT in $(seq 1 45); do
            BODY=$(curl --silent --show-error https://shadow-live.ashraf-business-440.workers.dev/health || true)
            echo "$BODY"
            if echo "$BODY" | grep -q "\"buildSha\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 2
          done
          echo "Exact Cloudflare build did not become active."
          exit 1

      - name: Run Cloudflare economy router phase 5 E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/economy-router-e2e.mjs
