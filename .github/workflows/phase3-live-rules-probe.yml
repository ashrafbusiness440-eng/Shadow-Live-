name: Phase 3 Live Rules Probe

on:
  push:
    branches:
      - feature/shadow-control-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase web SDK and Playwright
        run: |
          npm install --no-save firebase playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify production Firestore and Storage deny unauthenticated access
        run: |
          node --input-type=module <<'NODE'
          import { initializeApp } from 'firebase/app';
          import { readFile } from 'node:fs/promises';
          import { chromium } from 'playwright';
          import { getFirestore, collection, query, limit, getDocs, doc, deleteDoc } from 'firebase/firestore';

          const app = initializeApp({
            apiKey: 'AIzaSyAjDi9RdObZXHF16ecWt4J4zj2_1rdDmf8',
            appId: '1:463485983128:web:88c4953fa80d566c7a73ed',
            messagingSenderId: '463485983128',
            projectId: 'shadow-live',
            storageBucket: 'shadow-live.firebasestorage.app',
          });
          const db = getFirestore(app);

          async function expectFirestoreDenied(label, fn) {
            try {
              await fn();
              throw new Error(label + ' unexpectedly succeeded');
            } catch (error) {
              if (error?.code !== 'permission-denied') {
                throw new Error(label + ' expected permission-denied, got ' + (error?.code ?? error));
              }
              console.log(label + '_OK');
            }
          }

          await expectFirestoreDenied('PHASE3_LIVE_FIRESTORE_READ_DENIED', async () => {
            await getDocs(query(collection(db, 'users'), limit(1)));
          });

          await expectFirestoreDenied('PHASE3_LIVE_FIRESTORE_DELETE_DENIED', async () => {
            await deleteDoc(doc(db, 'users', 'phase3-live-probe-missing'));
          });

          const firebasePackage = JSON.parse(await readFile('./node_modules/firebase/package.json', 'utf8'));
          const firebaseVersion = firebasePackage.version;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.goto('about:blank');
          await page.addScriptTag({ url: 'https://www.gstatic.com/firebasejs/' + firebaseVersion + '/firebase-app-compat.js' });
          await page.addScriptTag({ url: 'https://www.gstatic.com/firebasejs/' + firebaseVersion + '/firebase-storage-compat.js' });

          const storageResult = await page.evaluate(async (config) => {
            const app = firebase.initializeApp(config);
            const storage = firebase.storage(app);

            async function probe(label, fn) {
              try {
                await fn();
                return { label, ok: false, code: 'unexpected-success', message: 'operation unexpectedly succeeded' };
              } catch (error) {
                return {
                  label,
                  ok: error?.code === 'storage/unauthorized',
                  code: error?.code ?? null,
                  message: error?.message ?? String(error),
                };
              }
            }

            const listProbe = await probe('PHASE3_LIVE_STORAGE_LIST_DENIED', async () => {
              await storage.ref('profile_images').list({ maxResults: 1 });
            });
            const deleteProbe = await probe('PHASE3_LIVE_STORAGE_DELETE_DENIED', async () => {
              await storage.ref('profile_images/phase3-live-probe-missing.jpg').delete();
            });

            return { listProbe, deleteProbe };
          }, {
            apiKey: 'AIzaSyAjDi9RdObZXHF16ecWt4J4zj2_1rdDmf8',
            appId: '1:463485983128:web:88c4953fa80d566c7a73ed',
            messagingSenderId: '463485983128',
            projectId: 'shadow-live',
            storageBucket: 'shadow-live.firebasestorage.app',
          });

          await browser.close();

          console.log('PHASE3_LIVE_STORAGE_BROWSER_RESULT', JSON.stringify(storageResult));
          if (!storageResult.listProbe.ok) {
            throw new Error('Storage list probe failed: ' + JSON.stringify(storageResult.listProbe));
          }
          if (!storageResult.deleteProbe.ok) {
            throw new Error('Storage delete probe failed: ' + JSON.stringify(storageResult.deleteProbe));
          }
          console.log('PHASE3_LIVE_STORAGE_LIST_DENIED_OK');
          console.log('PHASE3_LIVE_STORAGE_DELETE_DENIED_OK');

          console.log('PHASE3_LIVE_RULES_PROBE_OK');
          NODE
