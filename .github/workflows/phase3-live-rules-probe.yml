name: Phase 3 Live Rules Probe

on:
  push:
    branches:
      - feature/shadow-control-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase web SDK
        run: npm install --no-save firebase

      - name: Verify production Firestore and Storage deny unauthenticated access
        run: |
          node --input-type=module <<'NODE'
          import { initializeApp } from 'firebase/app';
          import { getFirestore, collection, query, limit, getDocs, doc, deleteDoc } from 'firebase/firestore';
          import { getStorage, ref as storageRef, list, deleteObject } from 'firebase/storage';

          const app = initializeApp({
            apiKey: 'AIzaSyAjDi9RdObZXHF16ecWt4J4zj2_1rdDmf8',
            appId: '1:463485983128:web:88c4953fa80d566c7a73ed',
            messagingSenderId: '463485983128',
            projectId: 'shadow-live',
            storageBucket: 'shadow-live.firebasestorage.app',
          });
          const db = getFirestore(app);
          const storage = getStorage(app);

          async function expectFirestoreDenied(label, fn) {
            try {
              await fn();
              throw new Error(label + ' unexpectedly succeeded');
            } catch (error) {
              if (error?.code !== 'permission-denied') {
                throw new Error(label + ' expected permission-denied, got ' + (error?.code ?? error));
              }
              console.log(label + '_OK');
            }
          }

          await expectFirestoreDenied('PHASE3_LIVE_FIRESTORE_READ_DENIED', async () => {
            await getDocs(query(collection(db, 'users'), limit(1)));
          });

          await expectFirestoreDenied('PHASE3_LIVE_FIRESTORE_DELETE_DENIED', async () => {
            await deleteDoc(doc(db, 'users', 'phase3-live-probe-missing'));
          });

          async function expectStorageDenied(label, fn) {
            try {
              await fn();
              throw new Error(label + ' unexpectedly succeeded');
            } catch (error) {
              const detail = {
                code: error?.code ?? null,
                message: error?.message ?? String(error),
                customData: error?.customData ?? null,
              };
              console.log(label + '_DETAIL', JSON.stringify(detail));
              if (error?.code !== 'storage/unauthorized') {
                throw new Error(label + ' expected storage/unauthorized, got ' + (error?.code ?? error));
              }
              console.log(label + '_OK');
            }
          }

          await expectStorageDenied('PHASE3_LIVE_STORAGE_LIST_DENIED', async () => {
            await list(storageRef(storage, 'profile_images'), { maxResults: 1 });
          });

          await expectStorageDenied('PHASE3_LIVE_STORAGE_DELETE_DENIED', async () => {
            await deleteObject(storageRef(storage, 'profile_images/phase3-live-probe-missing.jpg'));
          });

          console.log('PHASE3_LIVE_RULES_PROBE_OK');
          NODE
