name: Stage 08-B Batch E Wealth LV21-25

on:
  push:
    branches:
      - stage08b-batch-e-wealth-lv21-25
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage08b-batch-e-wealth-lv21-25
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded publisher dependencies
        run: pip install --disable-pip-version-check pillow requests google-auth

      - name: Generate validate publish link and verify Wealth LV21-25
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SHADOW_ASSET_GITHUB_TOKEN: ${{ secrets.SHADOW_ASSET_GITHUB_TOKEN }}
          WEALTH_TIER: lv21_25
        run: python cloudflare-worker/scripts/publish-wealth-tier-assets.py
