name: Shadow Live Web Preview

on:
  push:
    branches:
      - feature/recharge-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: shadow-live-web
          path: build/web
          if-no-files-found: error
          retention-days: 7
