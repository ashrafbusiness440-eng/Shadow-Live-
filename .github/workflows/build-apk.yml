name: Build compact Shadow Live Android APK

on:
  workflow_dispatch:
  # Only the isolated Android packaging branch can automatically create test APKs.
  # Do not run Android packaging for every main push or deploy.
  push:
    branches:
      - 'android/compact-arm64-apk-*'

permissions:
  contents: read

concurrency:
  group: shadow-live-android-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter and Android environment
        run: flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Compact bundled artwork in Android build workspace only
        shell: bash
        run: |
          set -euo pipefail
          echo "Original assets size:"
          du -sh assets/images
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends optipng pngquant webp

          # A high-quality perceptual palette dramatically shrinks large
          # photo-style PNGs without changing image paths or source files.
          # If the quality floor cannot be met, retain the full-quality PNG.
          find assets/images -type f -iname '*.png' -size +200k -print0 |
            xargs -0 -r -P 2 -n 1 bash -c 'pngquant --quality=88-98 --speed 3 --strip --skip-if-larger --force --ext .png "$0" || optipng -o2 -quiet "$0" || echo "Kept original PNG: $0" >&2'

          # The bundled gift WebPs contain oversized images. Re-encode only
          # these 4 large gift previews at quality 91 while retaining alpha.
          # A larger recode is discarded, preserving the original file.
          while IFS= read -r -d '' f; do
            tempdir="$(mktemp -d)"
            if dwebp "$f" -o "$tempdir/source.png" >/dev/null 2>&1 &&
               cwebp -quiet -q 91 -alpha_q 100 -m 6 "$tempdir/source.png" -o "$tempdir/recode.webp"; then
              if [ "$(stat -c%s "$tempdir/recode.webp")" -lt "$(stat -c%s "$f")" ]; then
                cp "$tempdir/recode.webp" "$f"
                echo "Recompressed gift preview: $f"
              fi
            fi
            rm -rf "$tempdir"
          done < <(find assets/images/gifts -type f -name '*.webp' -size +500k -print0)

          # Remove one known test-only picture from the build copy only.
          if [ -f assets/images/misc/asset_test.png ] &&
             ! grep -R -F -q 'asset_test.png' lib; then
            rm assets/images/misc/asset_test.png
            echo 'Excluded unused asset_test.png from Android package only'
          fi
          echo "Optimized assets size:"
          du -sh assets/images

      - name: Build ARM64 release APK with icon and ABI splitting
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Verify output and report package size
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          mkdir -p android-artifacts
          cp "$apk" android-artifacts/Shadow-Live-ARM64-test.apk
          echo "## Shadow Live Android test build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Architecture: ARM64 only, optimized release mode" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK size: $(du -h android-artifacts/Shadow-Live-ARM64-test.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed using the project's current Android debug signing configuration: **test/sideload only**, not Play Store release signing." >> "$GITHUB_STEP_SUMMARY"
          echo "- Android Firebase native push app registration is not supplied. Private call and push readiness remain disabled." >> "$GITHUB_STEP_SUMMARY"
          ls -lh android-artifacts/Shadow-Live-ARM64-test.apk

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Live-ARM64-test-apk
          path: android-artifacts/Shadow-Live-ARM64-test.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
