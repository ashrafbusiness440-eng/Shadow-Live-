name: Build Shadow Live APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk Shadow-Live-debug.apk

      - name: Upload Shadow Live APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Live-debug-apk
          path: Shadow-Live-debug.apk
          if-no-files-found: error
          retention-days: 14
