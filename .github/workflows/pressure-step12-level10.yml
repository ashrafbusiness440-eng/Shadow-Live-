name: Pressure Step 12 Level 5000

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pressure_step12_level10.mjs'
      - '.github/workflows/pressure-step12-level10.yml'
      - 'scripts/pressure_step12_level10.mjs'

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Step 12 level 5000
        run: node scripts/pressure_step12_level10.mjs
