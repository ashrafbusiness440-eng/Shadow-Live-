name: Bootstrap Shadow Live R2 Storage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-r2-storage.yml'
      - 'cloudflare-worker/wrangler.toml'
      - 'cloudflare-worker/src/storage-health.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure private R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket info shadow-live-storage --json >/tmp/r2-info.json 2>/tmp/r2-info.err; then
            cat /tmp/r2-info.json
            echo "R2_BUCKET_READY=existing" >> "$GITHUB_ENV"
            exit 0
          fi

          cat /tmp/r2-info.err || true
          echo "Bucket not found or not readable; attempting one-time creation."

          set +e
          npx wrangler r2 bucket create shadow-live-storage >/tmp/r2-create.out 2>/tmp/r2-create.err
          CREATE_STATUS=$?
          set -e

          cat /tmp/r2-create.out || true
          cat /tmp/r2-create.err || true

          if [ "$CREATE_STATUS" -ne 0 ]; then
            if grep -q "Authentication error.*10000" /tmp/r2-create.err /tmp/r2-create.out 2>/dev/null; then
              echo "::warning::Cloudflare token lacks R2 bucket-management permission (error 10000). Foundation code can still be validated, but production R2 remains blocked."
              echo "R2_BUCKET_READY=blocked_permissions" >> "$GITHUB_ENV"
              exit 0
            fi
            exit "$CREATE_STATUS"
          fi

          npx wrangler r2 bucket info shadow-live-storage --json
          echo "R2_BUCKET_READY=created" >> "$GITHUB_ENV"

      - name: Validate Worker bundle with R2 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --var BUILD_SHA:"$GITHUB_SHA"

      - name: R2 foundation result
        run: |
          echo "Shadow Live R2 bucket status: $R2_BUCKET_READY"
