name: Verify Shadow Live R2 Storage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-r2-storage.yml'
      - 'cloudflare-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify private R2 bucket with scoped S3 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { AwsClient } from "aws4fetch";

          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || "").trim();
          const accessKeyId = String(process.env.R2_ACCESS_KEY_ID || "").trim();
          const secretAccessKey = String(process.env.R2_SECRET_ACCESS_KEY || "").trim();
          if (!accountId || !accessKeyId || !secretAccessKey) {
            throw new Error("missing_r2_verification_credentials");
          }

          const client = new AwsClient({
            accessKeyId,
            secretAccessKey,
            service: "s3",
            region: "auto",
          });
          const url =
            `https://${accountId}.r2.cloudflarestorage.com/shadow-live-storage?list-type=2&max-keys=1`;
          const response = await client.fetch(url);
          if (!response.ok) {
            const text = await response.text();
            throw new Error(
              `r2_bucket_verification_failed:${response.status}:${text.slice(0, 200)}`,
            );
          }
          console.log("R2_BUCKET_READY=verified");
          NODE

      - name: Live smoke presigned R2 PUT GET DELETE
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { AwsClient } from "aws4fetch";
          import { presignR2Get, presignR2Put } from "./src/r2-presign.js";

          const env = {
            R2_ACCOUNT_ID: String(process.env.CLOUDFLARE_ACCOUNT_ID || "").trim(),
            R2_ACCESS_KEY_ID: String(process.env.R2_ACCESS_KEY_ID || "").trim(),
            R2_SECRET_ACCESS_KEY: String(process.env.R2_SECRET_ACCESS_KEY || "").trim(),
          };
          if (!env.R2_ACCOUNT_ID || !env.R2_ACCESS_KEY_ID || !env.R2_SECRET_ACCESS_KEY) {
            throw new Error("missing_r2_smoke_credentials");
          }

          const key = `_shadow_live_smoke/github-${process.env.GITHUB_RUN_ID || "local"}.png`;
          const payload = new Uint8Array([137, 80, 78, 71]);
          const mimeType = "image/png";
          const encodedKey = key.split("/").map(encodeURIComponent).join("/");
          const objectUrl =
            `https://${env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com/shadow-live-storage/${encodedKey}`;
          const directClient = new AwsClient({
            accessKeyId: env.R2_ACCESS_KEY_ID,
            secretAccessKey: env.R2_SECRET_ACCESS_KEY,
            service: "s3",
            region: "auto",
          });

          try {
            const putUrl = await presignR2Put(env, { key, mimeType, expiresSeconds: 120 });
            const put = await fetch(putUrl, {
              method: "PUT",
              headers: { "content-type": mimeType },
              body: payload,
            });
            if (!put.ok) {
              throw new Error(`presigned_put_failed:${put.status}:${(await put.text()).slice(0, 200)}`);
            }

            const getUrl = await presignR2Get(env, { key, expiresSeconds: 120 });
            const get = await fetch(getUrl);
            if (!get.ok) {
              throw new Error(`presigned_get_failed:${get.status}:${(await get.text()).slice(0, 200)}`);
            }
            const received = new Uint8Array(await get.arrayBuffer());
            if (
              received.length !== payload.length ||
              received.some((value, index) => value !== payload[index])
            ) {
              throw new Error("presigned_roundtrip_mismatch");
            }
            console.log("R2_PRESIGNED_ROUNDTRIP=verified");
          } finally {
            const deletion = await directClient.fetch(objectUrl, { method: "DELETE" });
            if (!deletion.ok && deletion.status !== 404) {
              throw new Error(`r2_smoke_cleanup_failed:${deletion.status}`);
            }
          }
          NODE

      - name: Validate Worker bundle with R2 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --dry-run \
            --var BUILD_SHA:"$GITHUB_SHA" \
            --var R2_ACCOUNT_ID:"$CLOUDFLARE_ACCOUNT_ID"

      - name: R2 foundation result
        run: |
          echo "Shadow Live R2 bucket status: verified"
