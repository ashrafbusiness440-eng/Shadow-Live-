name: Verify Shadow Live R2 Storage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-r2-storage.yml'
      - 'cloudflare-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify private R2 bucket with scoped S3 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { AwsClient } from "aws4fetch";

          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || "").trim();
          const accessKeyId = String(process.env.R2_ACCESS_KEY_ID || "").trim();
          const secretAccessKey = String(process.env.R2_SECRET_ACCESS_KEY || "").trim();
          if (!accountId || !accessKeyId || !secretAccessKey) {
            throw new Error("missing_r2_verification_credentials");
          }

          const client = new AwsClient({
            accessKeyId,
            secretAccessKey,
            service: "s3",
            region: "auto",
          });
          const url =
            `https://${accountId}.r2.cloudflarestorage.com/shadow-live-storage?list-type=2&max-keys=1`;
          const response = await client.fetch(url);
          if (!response.ok) {
            const text = await response.text();
            throw new Error(
              `r2_bucket_verification_failed:${response.status}:${text.slice(0, 200)}`,
            );
          }
          console.log("R2_BUCKET_READY=verified");
          NODE

      - name: Validate Worker bundle with R2 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --dry-run \
            --var BUILD_SHA:"$GITHUB_SHA" \
            --var R2_ACCOUNT_ID:"$CLOUDFLARE_ACCOUNT_ID"

      - name: R2 foundation result
        run: |
          echo "Shadow Live R2 bucket status: verified"
