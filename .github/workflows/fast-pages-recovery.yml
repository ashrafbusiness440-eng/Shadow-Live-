name: Fast Publish Verified gh-pages Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shadow-live-fast-recovery
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified gh-pages snapshot
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Verify snapshot markers
        run: |
          test -f deploy.json
          test -f app/deploy.json
          grep -q "587a62914776217348436506f058ecbf61dcbeb1" deploy.json
          grep -q "registration.unregister" flutter_service_worker.js
          grep -q "registration.unregister" app/flutter_service_worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified snapshot
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy verified snapshot
        id: deployment
        uses: actions/deploy-pages@v4
