name: Deploy Shadow Live + Shadow Control to GitHub Pages

on:
  push:
    branches: [phase8-games]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shadow-live-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Shadow Control
        run: |
          flutter build web --release --target lib/main_control.dart --base-href /Shadow-Live-/
          rm -rf site
          mkdir -p site
          cp -R build/web/. site/

      - name: Build Shadow Live app
        run: |
          flutter build web --release --target lib/main.dart --base-href /Shadow-Live-/app/
          mkdir -p site/app
          cp -R build/web/. site/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
