name: Deploy Shadow Live + Shadow Control to GitHub Pages

on:
  push:
    branches: [main, phase8-games]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shadow-live-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze game integration
        run: flutter analyze lib/features/games

      - name: Run game widget tests
        run: flutter test test/games

      - name: Verify production source before build
        run: |
          grep -q "GamesHubScreen" lib/features/main/screens/main_shell_screen.dart
          grep -q "greedy_cat" lib/features/games/screens/games_hub_screen.dart
          grep -q "assets/images/games/greedy_cat" lib/admin/control_asset_policy.dart
          grep -q "assets/images/games/witch" lib/admin/control_asset_policy.dart
          grep -q "assets/images/games/slot" lib/admin/control_asset_policy.dart
          grep -q '"/Shadow-Live-/app/"' scripts/app_manifest.json
          grep -q '"/Shadow-Live-/control/"' scripts/control_manifest.json

      - name: Build Shadow Control with isolated PWA identity
        run: |
          rm -rf build/web site
          cp scripts/control_index.html web/index.html
          cp scripts/control_manifest.json web/manifest.json
          flutter build web --release --pwa-strategy=none --target lib/main_control.dart --base-href /Shadow-Live-/control/
          mkdir -p site/control
          cp -R build/web/. site/control/
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=${GITHUB_SHA}#g" site/control/index.html
          sed -i "s#main.dart.js#main.dart.js?v=${GITHUB_SHA}#g" site/control/flutter_bootstrap.js

      - name: Verify Shadow Control build
        run: |
          test -f site/control/main.dart.js
          grep -q "assets/images/games/greedy_cat" site/control/main.dart.js
          grep -q "assets/images/games/witch" site/control/main.dart.js
          grep -q "assets/images/games/slot" site/control/main.dart.js
          grep -q '"id": "/Shadow-Live-/control/"' site/control/manifest.json
          grep -q '"scope": "/Shadow-Live-/control/"' site/control/manifest.json
          grep -q 'Shadow Control' site/control/manifest.json
          grep -q "flutter_bootstrap.js?v=${GITHUB_SHA}" site/control/index.html
          grep -q "main.dart.js?v=${GITHUB_SHA}" site/control/flutter_bootstrap.js

      - name: Build Shadow Live with isolated PWA identity
        run: |
          rm -rf build/web
          cp scripts/app_index.html web/index.html
          cp scripts/app_manifest.json web/manifest.json
          flutter build web --release --pwa-strategy=none --target lib/main.dart --base-href /Shadow-Live-/app/
          mkdir -p site/app
          cp -R build/web/. site/app/
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=${GITHUB_SHA}#g" site/app/index.html
          sed -i "s#main.dart.js#main.dart.js?v=${GITHUB_SHA}#g" site/app/flutter_bootstrap.js

      - name: Verify Shadow Live build
        run: |
          test -f site/app/main.dart.js
          grep -q "greedy_cat" site/app/main.dart.js
          grep -q "witch" site/app/main.dart.js
          grep -q "slot" site/app/main.dart.js
          grep -q '"id": "/Shadow-Live-/app/"' site/app/manifest.json
          grep -q '"scope": "/Shadow-Live-/app/"' site/app/manifest.json
          grep -q '"name": "Shadow Live"' site/app/manifest.json
          grep -q "flutter_bootstrap.js?v=${GITHUB_SHA}" site/app/index.html
          grep -q "main.dart.js?v=${GITHUB_SHA}" site/app/flutter_bootstrap.js

      - name: Create non-PWA root launcher
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#05060D">
            <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
            <title>Shadow Live</title>
            <style>
              html,body{margin:0;min-height:100%;background:#05060d;color:#fff;font-family:Arial,sans-serif}
              body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
              main{width:min(520px,100%);background:#0d0f18;border:1px solid #29233c;border-radius:24px;padding:24px;box-sizing:border-box}
              h1{margin:0 0 8px;font-size:28px}
              p{color:#aaa;margin:0 0 24px;line-height:1.7}
              a{display:block;text-decoration:none;text-align:center;padding:16px;margin-top:12px;border-radius:16px;font-weight:700}
              .app{background:#7b2dff;color:white}.control{background:#d8b84a;color:#17120a}
            </style>
          </head>
          <body>
            <main>
              <h1>Shadow Live</h1>
              <p>اختر الواجهة التي تريد فتحها. التطبيق والكونترول أصبحا PWA منفصلين بهوية ونطاق مستقل.</p>
              <a class="app" href="/Shadow-Live-/app/">فتح Shadow Live</a>
              <a class="control" href="/Shadow-Live-/control/">فتح Shadow Control</a>
            </main>
          </body>
          </html>
          EOF

      - name: Add immutable deployment markers
        run: |
          printf '{"commit":"%s","ref":"%s","run_id":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/deploy.json
          cp site/deploy.json site/app/deploy.json
          cp site/deploy.json site/control/deploy.json

          cat > site/app/refresh.html <<EOF
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <meta name="theme-color" content="#05060D">
            <title>تحديث Shadow Live</title>
            <style>
              html,body{margin:0;min-height:100%;background:#05060d;color:#fff;font-family:Arial,sans-serif}
              body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
              main{width:min(460px,100%);text-align:center;background:#0d0f18;border:1px solid #2c2344;border-radius:24px;padding:26px;box-sizing:border-box}
              h1{margin:0 0 10px;font-size:24px}
              p{margin:0;color:#bbb;line-height:1.7}
            </style>
          </head>
          <body>
            <main>
              <h1>تحديث Shadow Live</h1>
              <p>جارٍ حذف نسخة الويب القديمة وفتح آخر إصدار…</p>
            </main>
            <script>
            (async () => {
              try {
                if ('serviceWorker' in navigator) {
                  const registrations = await navigator.serviceWorker.getRegistrations();
                  await Promise.all(registrations.map((registration) => registration.unregister()));
                }
                if ('caches' in window) {
                  const keys = await caches.keys();
                  await Promise.all(keys.map((key) => caches.delete(key)));
                }
              } catch (_) {}
              location.replace('/Shadow-Live-/app/?build=$GITHUB_SHA&fresh=1');
            })();
            </script>
          </body>
          </html>
          EOF

          touch site/.nojekyll

      - name: Kill all legacy Flutter service workers and caches
        run: |
          cat > /tmp/flutter_service_worker.js <<'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
              await self.registration.unregister();
              const clients = await self.clients.matchAll({ type: 'window', includeUncontrolled: true });
              for (const client of clients) {
                client.navigate(client.url);
              }
            })());
          });
          self.addEventListener('fetch', () => {});
          EOF
          cp /tmp/flutter_service_worker.js site/flutter_service_worker.js
          cp /tmp/flutter_service_worker.js site/app/flutter_service_worker.js
          cp /tmp/flutter_service_worker.js site/control/flutter_service_worker.js

      - name: Publish verified static snapshot to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git add -A
          git commit -m "Publish isolated Shadow Live PWAs ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

