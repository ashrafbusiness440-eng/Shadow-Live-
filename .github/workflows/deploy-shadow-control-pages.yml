name: Deploy Shadow Live + Shadow Control to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shadow-live-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze game integration
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/games lib/visual/greedy_cat_visual_test_app.dart

      - name: Run game tests
        run: flutter test test/games

      - name: Verify production source before build
        run: |
          grep -q "GamesHubScreen" lib/features/main/screens/main_shell_screen.dart
          grep -q "greedy_cat" lib/features/games/screens/games_hub_screen.dart
          grep -q "assets/images/games/greedy_cat" lib/admin/control_asset_policy.dart
          grep -q "assets/images/games/witch" lib/admin/control_asset_policy.dart
          grep -q "assets/images/games/slot" lib/admin/control_asset_policy.dart
          grep -q '"/Shadow-Live-/app/"' scripts/app_manifest.json
          grep -q '"/Shadow-Live-/control/"' scripts/control_manifest.json

      - name: Build Shadow Control with isolated PWA identity
        run: |
          rm -rf build/web site
          cp scripts/control_index.html web/index.html
          cp scripts/control_manifest.json web/manifest.json
          flutter build web --release --pwa-strategy=none --target lib/main_control.dart --base-href /Shadow-Live-/control/
          mkdir -p site/control
          cp -R build/web/. site/control/
          # Only Live may register private call FCM workers; never Control.
          rm -f site/control/firebase-messaging-sw.js site/control/private_call_web_push.js

      - name: Verify Shadow Control build
        run: |
          test -f site/control/main.dart.js
          grep -q "assets/images/games/greedy_cat" site/control/main.dart.js
          grep -q "assets/images/games/witch" site/control/main.dart.js
          grep -q "assets/images/games/slot" site/control/main.dart.js
          grep -q '"id": "/Shadow-Live-/control/"' site/control/manifest.json
          grep -q '"scope": "/Shadow-Live-/control/"' site/control/manifest.json
          grep -q 'Shadow Control' site/control/manifest.json

      - name: Build Shadow Live in clean production scope
        env:
          SHADOW_FIREBASE_WEB_VAPID_KEY: ${{ vars.SHADOW_FIREBASE_WEB_VAPID_KEY }}
        run: |
          rm -rf build/web
          cp scripts/app_index.html web/index.html
          cp scripts/app_manifest.json web/manifest.json
          flutter build web --release --pwa-strategy=none --target lib/main.dart --base-href /Shadow-Live-/live/ --dart-define="SHADOW_FIREBASE_WEB_VAPID_KEY=$SHADOW_FIREBASE_WEB_VAPID_KEY"
          mkdir -p site/live
          cp -R build/web/. site/live/
          sed -i 's#/Shadow-Live-/app/#/Shadow-Live-/live/#g' site/live/manifest.json

      - name: Version production Flutter entrypoints per deployment
        run: |
          # Both the Flutter bootstrap and the actual Dart bundle need unique
          # URLs; otherwise an installed Android PWA can reuse older JS.
          python3 - <<'PY'
          import os
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          assert len(sha) == 40 and all(ch in "0123456789abcdef" for ch in sha)
          for scope in ("live", "control"):
              root = Path("site") / scope
              html_path = root / "index.html"
              html = html_path.read_text()
              if scope == "live":
                  old = "v=20261002-main-shell-fix"
                  assert html.count(old) >= 1, "missing Live bootstrap revision"
                  html = html.replace(old, "v=" + sha)
              else:
                  old = 'src="flutter_bootstrap.js"'
                  assert html.count(old) == 1, "missing Control bootstrap"
                  html = html.replace(
                      old, 'src="flutter_bootstrap.js?v=' + sha + '"'
                  )
              html_path.write_text(html)
              bootstrap_path = root / "flutter_bootstrap.js"
              bootstrap = bootstrap_path.read_text()
              old_main = '"mainJsPath":"main.dart.js"'
              assert bootstrap.count(old_main) == 1, (
                  "unexpected Flutter bootstrap format in " + scope
              )
              bootstrap = bootstrap.replace(
                  old_main, '"mainJsPath":"main.dart.js?v=' + sha + '"'
              )
              bootstrap_path.write_text(bootstrap)
              assert "flutter_bootstrap.js?v=" + sha in html
              assert '"mainJsPath":"main.dart.js?v=' + sha + '"' in bootstrap
              print(scope, "bundle cache version", sha[:12])
          PY

      - name: Verify Shadow Live build
        run: |
          test -s site/live/assets/packages/zego_express_engine/assets/ZegoExpressWebFlutterWrapper.js
          grep -q 'src="assets/packages/zego_express_engine/assets/ZegoExpressWebFlutterWrapper.js"' site/live/index.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('site/live/index.html').read_text()
          bridge = 'assets/packages/zego_express_engine/assets/ZegoExpressWebFlutterWrapper.js'
          assert html.count(bridge) == 1
          assert html.index(bridge) < html.index('flutter_bootstrap.js')
          PY
          test -f site/live/main.dart.js
          grep -q "greedy_cat" site/live/main.dart.js
          grep -q "serverRoundSelections" site/live/main.dart.js
          grep -q "pizza.webp" site/live/main.dart.js
          ! grep -q "قيمة الضغطة الحالية" site/live/main.dart.js
          grep -q "witch" site/live/main.dart.js
          grep -q "slot" site/live/main.dart.js
          grep -q '"id": "/Shadow-Live-/live/"' site/live/manifest.json
          grep -q '"scope": "/Shadow-Live-/live/"' site/live/manifest.json
          grep -q '"name": "Shadow Live"' site/live/manifest.json

      - name: Build real Greedy Cat visual browser harness
        run: |
          rm -rf build/web visual-browser
          cp scripts/app_index.html web/index.html
          cp scripts/app_manifest.json web/manifest.json
          flutter build web --release --pwa-strategy=none --target lib/visual/greedy_cat_visual_test_app.dart --base-href /
          mkdir -p visual-browser
          cp -R build/web/. visual-browser/

      - name: Upload Greedy Cat visual browser harness
        uses: actions/upload-artifact@v4
        with:
          name: greedy-cat-visual-browser
          path: visual-browser
          retention-days: 1

      - name: Create non-PWA root launcher
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#05060D">
            <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
            <title>Shadow Live</title>
            <style>
              html,body{margin:0;min-height:100%;background:#05060d;color:#fff;font-family:Arial,sans-serif}
              body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
              main{width:min(520px,100%);background:#0d0f18;border:1px solid #29233c;border-radius:24px;padding:24px;box-sizing:border-box}
              h1{margin:0 0 8px;font-size:28px}
              p{color:#aaa;margin:0 0 24px;line-height:1.7}
              a{display:block;text-decoration:none;text-align:center;padding:16px;margin-top:12px;border-radius:16px;font-weight:700}
              .app{background:#7b2dff;color:white}.control{background:#d8b84a;color:#17120a}
            </style>
          </head>
          <body>
            <main>
              <h1>Shadow Live</h1>
              <p>اختر الواجهة التي تريد فتحها. التطبيق والكونترول أصبحا PWA منفصلين بهوية ونطاق مستقل.</p>
              <a class="app" href="/Shadow-Live-/live/">فتح Shadow Live</a>
              <a class="control" href="/Shadow-Live-/control/">فتح Shadow Control</a>
            </main>
          </body>
          </html>
          EOF

      - name: Publish independent account deletion request page
        run: |
          mkdir -p site/account-deletion
          cp web/account-deletion.html site/account-deletion/index.html
          test -s site/account-deletion/index.html
          grep -q '/api/account-deletion' site/account-deletion/index.html
          grep -q 'signInWithPhoneNumber' site/account-deletion/index.html

      - name: Retire legacy app scope and add deployment markers
        run: |
          mkdir -p site/app
          cat > site/app/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <meta http-equiv="refresh" content="0;url=/Shadow-Live-/live/">
            <title>Shadow Live</title>
          </head>
          <body style="background:#05060d;color:white;font-family:Arial;text-align:center;padding-top:25vh">
            <p>جارٍ فتح النسخة الجديدة من Shadow Live…</p>
            <p><a style="color:#b96cff" href="/Shadow-Live-/live/">فتح التطبيق</a></p>
          </body>
          </html>
          EOF

          printf '{"commit":"%s","ref":"%s","run_id":"%s","built_at":"%s","app_scope":"live"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/deploy.json
          cp site/deploy.json site/live/deploy.json
          cp site/deploy.json site/app/deploy.json
          cp site/deploy.json site/control/deploy.json
          touch site/.nojekyll

      - name: Kill all legacy Flutter service workers and caches
        run: |
          cat > /tmp/flutter_service_worker.js <<'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
              await self.registration.unregister();
              const clients = await self.clients.matchAll({ type: 'window', includeUncontrolled: true });
              for (const client of clients) {
                client.navigate(client.url);
              }
            })());
          });
          self.addEventListener('fetch', () => {});
          EOF
          cp /tmp/flutter_service_worker.js site/flutter_service_worker.js
          cp /tmp/flutter_service_worker.js site/app/flutter_service_worker.js
          cp /tmp/flutter_service_worker.js site/live/flutter_service_worker.js
          cp /tmp/flutter_service_worker.js site/control/flutter_service_worker.js

      # GitHub Pages is deployed by the official upload-pages-artifact/deploy-pages
      # pair below. Force-pushing a duplicate Flutter build to gh-pages can
      # block release for hours and provides no deployment guarantee. Keep
      # only the verified artifact used by the Pages deployment environment.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
