name: Cloudflare Chat Safety E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-production-firestore-e2e
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Cloudflare Chat Safety E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/chat-safety-e2e.mjs
