name: Visual QA Asset Studio

on:
  push:
    branches: [main]
    paths:
      - scripts/visual-qa-asset-studio.mjs
      - .github/workflows/visual-qa-asset-studio.yml
  workflow_run:
    workflows: ["Deploy Shadow Live + Shadow Control to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright client
        run: npm install --no-save playwright@1.55.0

      - name: Run visual QA against live Shadow Control
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/visual-qa-asset-studio.mjs

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-studio-visual-qa
          path: visual-qa
          retention-days: 3
