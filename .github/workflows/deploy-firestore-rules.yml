name: Deploy Firestore Rules + Indexes

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-firestore-rules
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect index configuration changes
        id: indexes_scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_index_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "run_index_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" |
            grep -Fxq '.github/workflows/deploy-firestore-rules.yml'; then
            # One idempotent full sync after fixing index matching.
            echo "run_index_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" |
            grep -Fxq 'firestore.indexes.json'; then
            # Do not reprovision unrelated old indexes when an index was only
            # removed from config. Still fail closed for every new index.
            new_indexes=$(python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          before = os.environ["BEFORE_SHA"]
          previous = json.loads(subprocess.check_output(
              ["git", "show", f"{before}:firestore.indexes.json"], text=True))
          current = json.loads(Path("firestore.indexes.json").read_text())

          def signatures(config):
              return {
                  (
                      entry.get("collectionGroup", ""),
                      entry.get("queryScope", "COLLECTION"),
                      tuple(
                          (field.get("fieldPath", ""), field.get("order", ""),
                           field.get("arrayConfig", ""))
                          for field in entry.get("fields", [])
                          if field.get("fieldPath") != "__name__"
                      ),
                  )
                  for entry in config.get("indexes", [])
              }

          print("true" if signatures(current) - signatures(previous) else "false")
          PY
            )
            echo "run_index_sync=$new_indexes" >> "$GITHUB_OUTPUT"
            if [[ "$new_indexes" == "false" ]]; then
              echo "Only removed/unchanged index definitions; no new index to provision."
            fi
          else
            echo "run_index_sync=false" >> "$GITHUB_OUTPUT"
            echo "Index config unchanged; publishing rules without index creation."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Firestore rules through Rules API
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { sign } from 'node:crypto';

          let sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (typeof sa === 'string') sa = JSON.parse(sa);
          const projectId = sa.project_id;
          const clientEmail = sa.client_email;
          const privateKey = String(sa.private_key || '').replace(/\\n/g, '\n');
          if (!projectId || !clientEmail || !privateKey) throw new Error('invalid service account');

          const b64url = (value) => Buffer.from(value)
            .toString('base64')
            .replace(/=/g, '')
            .replace(/\+/g, '-')
            .replace(/\//g, '_');

          const now = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = b64url(JSON.stringify({
            iss: clientEmail,
            scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          }));
          const unsigned = header + '.' + payload;
          const assertion = unsigned + '.' + b64url(
            sign('RSA-SHA256', Buffer.from(unsigned), privateKey),
          );

          const oauth = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion,
            }),
          });
          const oauthBody = await oauth.json();
          if (!oauth.ok || !oauthBody.access_token) {
            throw new Error('oauth failed ' + oauth.status + ' ' + JSON.stringify(oauthBody));
          }
          const token = oauthBody.access_token;
          const headers = {
            authorization: 'Bearer ' + token,
            'content-type': 'application/json',
          };
          const source = fs.readFileSync('firestore.rules', 'utf8');

          const createRuleset = await fetch(
            'https://firebaserules.googleapis.com/v1/projects/' +
              encodeURIComponent(projectId) +
              '/rulesets',
            {
              method: 'POST',
              headers,
              body: JSON.stringify({
                source: {
                  files: [{ name: 'firestore.rules', content: source }],
                },
              }),
            },
          );
          const ruleset = await createRuleset.json().catch(() => ({}));
          if (!createRuleset.ok || !ruleset.name) {
            throw new Error(
              'ruleset create failed ' +
                createRuleset.status +
                ' ' +
                JSON.stringify(ruleset),
            );
          }

          const releaseName = 'projects/' + projectId + '/releases/cloud.firestore';
          const patch = await fetch(
            'https://firebaserules.googleapis.com/v1/' + releaseName,
            {
              method: 'PATCH',
              headers,
              body: JSON.stringify({
                release: {
                  name: releaseName,
                  rulesetName: ruleset.name,
                },
                updateMask: 'rulesetName',
              }),
            },
          );
          let release = await patch.json().catch(() => ({}));

          if (patch.status === 404) {
            const createRelease = await fetch(
              'https://firebaserules.googleapis.com/v1/projects/' +
                encodeURIComponent(projectId) +
                '/releases',
              {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  name: releaseName,
                  rulesetName: ruleset.name,
                }),
              },
            );
            release = await createRelease.json().catch(() => ({}));
            if (!createRelease.ok) {
              throw new Error(
                'release create failed ' +
                  createRelease.status +
                  ' ' +
                  JSON.stringify(release),
              );
            }
          } else if (!patch.ok) {
            throw new Error(
              'release update failed ' +
                patch.status +
                ' ' +
                JSON.stringify(release),
            );
          }

          console.log('Firestore rules released:', ruleset.name);
          console.log('Release:', release.name || releaseName);

          const schedulerLocation =
            'projects/' + projectId + '/locations/us-central1';
          const schedulerResponse = await fetch(
            'https://cloudscheduler.googleapis.com/v1/' +
              schedulerLocation +
              '/jobs?pageSize=500',
            { headers: { authorization: 'Bearer ' + token } },
          );
          const schedulerBody = await schedulerResponse.json().catch(() => ({}));
          const schedulerDisabled =
            schedulerResponse.status === 403 &&
            Array.isArray(schedulerBody?.error?.details) &&
            schedulerBody.error.details.some((detail) =>
              detail?.reason === 'SERVICE_DISABLED' &&
              detail?.metadata?.service === 'cloudscheduler.googleapis.com',
            );

          if (schedulerDisabled) {
            console.log(
              'Cloud Scheduler API is disabled; no deployed Firebase scheduled settlement job can be active.',
            );
          } else if (!schedulerResponse.ok) {
            throw new Error(
              'scheduler list failed ' +
                schedulerResponse.status +
                ' ' +
                JSON.stringify(schedulerBody),
            );
          }

          const legacySettlementJobs = schedulerDisabled
            ? []
            : (schedulerBody.jobs || []).filter((job) =>
                String(job.name || '').toLowerCase().includes('gamesettlementworker'),
              );
          if (legacySettlementJobs.length === 0 && !schedulerDisabled) {
            console.log('No legacy Firebase game settlement scheduler found.');
          }
          for (const job of legacySettlementJobs) {
            if (job.state === 'PAUSED') {
              console.log('Legacy Firebase settlement scheduler already paused:', job.name);
              continue;
            }
            const pauseResponse = await fetch(
              'https://cloudscheduler.googleapis.com/v1/' +
                job.name +
                ':pause',
              {
                method: 'POST',
                headers,
                body: '{}',
              },
            );
            const pauseBody = await pauseResponse.json().catch(() => ({}));
            if (!pauseResponse.ok) {
              throw new Error(
                'scheduler pause failed ' +
                  pauseResponse.status +
                  ' ' +
                  JSON.stringify(pauseBody),
              );
            }
            console.log('Paused legacy Firebase settlement scheduler:', job.name);
          }
          NODE

      - name: Deploy Firestore composite indexes through Admin API
        # Index creation needs separate IAM permissions. A rules-only change
        # must not attempt to provision unrelated indexes and fail the release.
        # Manual dispatch intentionally performs a full index sync.
        if: steps.indexes_scope.outputs.run_index_sync == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { sign } from 'node:crypto';

          let sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (typeof sa === 'string') sa = JSON.parse(sa);
          const projectId = sa.project_id;
          const clientEmail = sa.client_email;
          const privateKey = String(sa.private_key || '').replace(/\\n/g, '\n');
          if (!projectId || !clientEmail || !privateKey) {
            throw new Error('invalid service account');
          }

          const b64url = (value) => Buffer.from(value)
            .toString('base64')
            .replace(/=/g, '')
            .replace(/\+/g, '-')
            .replace(/\//g, '_');

          const now = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = b64url(JSON.stringify({
            iss: clientEmail,
            scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          }));
          const unsigned = header + '.' + payload;
          const assertion = unsigned + '.' + b64url(
            sign('RSA-SHA256', Buffer.from(unsigned), privateKey),
          );

          const oauth = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion,
            }),
          });
          const oauthBody = await oauth.json().catch(() => ({}));
          if (!oauth.ok || !oauthBody.access_token) {
            throw new Error('oauth failed ' + oauth.status + ' ' + JSON.stringify(oauthBody));
          }

          const headers = {
            authorization: 'Bearer ' + oauthBody.access_token,
            'content-type': 'application/json',
          };
          const config = JSON.parse(fs.readFileSync('firestore.indexes.json', 'utf8'));
          const desired = Array.isArray(config.indexes) ? config.indexes : [];

          const fieldSignature = (fields) => (Array.isArray(fields) ? fields : [])
            .filter((field) => String(field?.fieldPath || '') !== '__name__')
            .map((field) => {
              const path = String(field?.fieldPath || '');
              const mode = field?.order
                ? 'order:' + String(field.order)
                : 'array:' + String(field?.arrayConfig || '');
              return path + ':' + mode;
            })
            .join('|');

          const indexSignature = (index) =>
            String(index?.queryScope || 'COLLECTION') + '::' +
            fieldSignature(index?.fields);

          const listIndexes = async (parentUrl) => {
            const indexes = [];
            let pageToken = '';
            do {
              const url = new URL(parentUrl + '/indexes');
              if (pageToken) url.searchParams.set('pageToken', pageToken);
              const response = await fetch(url, { headers });
              const body = await response.json().catch(() => ({}));
              if (!response.ok) {
                throw new Error(
                  'index list failed ' + response.status + ' ' + JSON.stringify(body),
                );
              }
              indexes.push(...(Array.isArray(body.indexes) ? body.indexes : []));
              pageToken = String(body.nextPageToken || '');
            } while (pageToken);
            return indexes;
          };

          const byCollection = new Map();
          for (const index of desired) {
            const collectionGroup = String(index?.collectionGroup || '').trim();
            if (!collectionGroup) throw new Error('missing collectionGroup in firestore.indexes.json');
            if (!byCollection.has(collectionGroup)) byCollection.set(collectionGroup, []);
            byCollection.get(collectionGroup).push(index);
          }

          for (const [collectionGroup, indexes] of byCollection.entries()) {
            const parent =
              'projects/' + projectId +
              '/databases/(default)/collectionGroups/' + collectionGroup;
            const parentUrl =
              'https://firestore.googleapis.com/v1/projects/' +
              encodeURIComponent(projectId) +
              '/databases/(default)/collectionGroups/' +
              encodeURIComponent(collectionGroup);
            // Only compare indexes from this exact collection group. Some
            // Admin API list responses include other groups; fields alone
            // would mistake a VIP index for notifications.
            const existing = (await listIndexes(parentUrl))
              .filter((index) =>
                String(index?.name || '').startsWith(parent + '/indexes/'));
            const existingSignatures = new Set(existing.map(indexSignature));
            // Store finance pages use an explicit DESC document-ID
            // tie-breaker. Earlier signature matching ignores __name__ and
            // can confuse ASC and DESC composite indexes for the same fields.
            const strictStoreIndex = new Set([
              'store_purchase_receipts','store_purchase_operations',
              'financial_ledger','admin_audit_logs',
            ]).has(collectionGroup);
            const matchesDesired = (candidate, wanted) =>
              indexSignature(candidate) === indexSignature(wanted) &&
              (!strictStoreIndex ||
                String((candidate.fields || []).find(f =>
                  f.fieldPath === '__name__')?.order || '') ===
                String((wanted.fields || []).find(f =>
                  f.fieldPath === '__name__')?.order || ''));


            for (const desiredIndex of indexes) {
              const signature = indexSignature(desiredIndex);
              const match = existing.find(item =>
                matchesDesired(item,desiredIndex));
              if (existingSignatures.has(signature) && match) {
                console.log(
                  'Firestore index already present:',
                  match?.name || parent + '/indexes/<existing>',
                  'state=' + String(match?.state || 'UNKNOWN'),
                );
                continue;
              }

              const body = {
                queryScope: String(desiredIndex.queryScope || 'COLLECTION'),
                fields: (desiredIndex.fields || []).map((field) => ({
                  fieldPath: String(field.fieldPath || ''),
                  ...(field.order ? { order: String(field.order) } : {}),
                  ...(field.arrayConfig
                    ? { arrayConfig: String(field.arrayConfig) }
                    : {}),
                })),
              };
              const response = await fetch(parentUrl + '/indexes', {
                method: 'POST',
                headers,
                body: JSON.stringify(body),
              });
              const result = await response.json().catch(() => ({}));
              if (!response.ok && response.status !== 409) {
                throw new Error(
                  'index create failed ' + response.status + ' ' + JSON.stringify(result),
                );
              }
              if (response.status === 409) {
                console.log('Firestore index already exists (race):', parent, signature);
              } else {
                console.log(
                  'Firestore index creation accepted:',
                  result.name || parent,
                  signature,
                );
              }
            }
          }

          // Never approve the receipt/history or finance parity queries by
          // index-creation ACK alone. Poll the EXACT source indexes used by
          // the bounded Owner Store report; an ASC __name__ fallback is NOT
          // equivalent to the required DESC traversal.
          const requiredStoreIndexes = [
            ['store_purchase_receipts',
              'buyerUid:order:ASCENDING|acquiredAtMs:order:DESCENDING'],
            ['store_purchase_operations','buyerUid:order:ASCENDING'],
            ['financial_ledger',
              'userId:order:ASCENDING|sourceType:order:ASCENDING'],
            ['admin_audit_logs',
              'actorUid:order:ASCENDING|action:order:ASCENDING'],
          ];
          for(const [group,fieldKey] of requiredStoreIndexes){
            const desiredIndex=(byCollection.get(group)||[])
              .find(i=>fieldSignature(i.fields)===fieldKey &&
                (i.fields||[]).some(f=>f.fieldPath==='__name__' &&
                  f.order==='DESCENDING'));
            if(!desiredIndex)throw new Error('required_store_index_missing:'+group);
            const parent='projects/'+projectId+
              '/databases/(default)/collectionGroups/'+group;
            const url='https://firestore.googleapis.com/v1/projects/'+
              encodeURIComponent(projectId)+
              '/databases/(default)/collectionGroups/'+group;
            let ready=false;
            for(let attempt=0;attempt<24;attempt++){
              const match=(await listIndexes(url)).find(item=>
                String(item?.name||'').startsWith(parent+'/indexes/') &&
                indexSignature(item)===indexSignature(desiredIndex) &&
                String((item.fields||[]).find(f=>
                  f.fieldPath==='__name__')?.order||'')==='DESCENDING');
              if(match?.state==='READY'){
                console.log('Store finance index READY:',group,match.name);
                if(group==='store_purchase_receipts')
                  console.log('Store purchase receipts index READY:',match.name);
                ready=true;break;
              }
              if(match?.state==='NEEDS_REPAIR')
                throw new Error('store_finance_index_needs_repair:'+group);
              if(attempt<23)
                await new Promise(resolve=>setTimeout(resolve,5000));
            }
            if(!ready)throw new Error('store_finance_index_not_ready:'+group);
          }

          console.log('Firestore composite index sync completed.');
          NODE
