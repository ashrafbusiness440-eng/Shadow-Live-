name: Migrate legacy user level data

on:
  push:
    branches: [main]
    paths:
      - cloudflare-worker/scripts/migrate-legacy-user-level-data.mjs
      - .github/workflows/migrate-legacy-user-level-data.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-legacy-level-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bounded legacy level field cleanup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/migrate-legacy-user-level-data.mjs
