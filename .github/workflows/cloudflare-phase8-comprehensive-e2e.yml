name: Cloudflare Phase 8 Comprehensive E2E

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/src/**'
      - 'cloudflare-worker/scripts/**'
      - 'cloudflare-worker/wrangler.toml'
      - '.github/workflows/cloudflare-phase8-comprehensive-e2e.yml'
      - '.github/workflows/cloudflare-*-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-live-production-firestore-e2e
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      run_gate: ${{ steps.decide.outputs.run_gate }}
    steps:
      - name: Skip superseded automatic production gate
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
            echo "Manual production validation requested."
            exit 0
          fi
          MAIN_SHA=$(curl --fail --silent --show-error \
            https://api.github.com/repos/ashrafbusiness440-eng/Shadow-Live-/commits/main | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "Current main: $MAIN_SHA"
          echo "Triggered SHA: $GITHUB_SHA"
          if [ "$MAIN_SHA" = "$GITHUB_SHA" ]; then
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_gate=false" >> "$GITHUB_OUTPUT"
            echo "This automatic run was superseded by a newer main commit; skipping production load."
          fi

  comprehensive-e2e:
    needs: freshness
    if: needs.freshness.outputs.run_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recheck Phase 7 Cloudflare cutover
        run: python3 scripts/phase7_cloudflare_audit.py

      - name: Wait for exact Cloudflare Worker build when Worker changed
        run: |
          CHANGED=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          if ! echo "$CHANGED" | grep -Eq '^cloudflare-worker/(src|wrangler\.toml)'; then
            echo "Worker source unchanged in this commit; using current deployed Worker."
            curl --fail --silent --show-error https://shadow-live.ashraf-business-440.workers.dev/health
            exit 0
          fi
          for ATTEMPT in $(seq 1 60); do
            BODY=$(curl --silent --show-error https://shadow-live.ashraf-business-440.workers.dev/health || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"ok":true' && echo "$BODY" | grep -q "\"buildSha\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare Worker did not reach commit $GITHUB_SHA"
          exit 1

      - name: Wait for exact production Pages build
        run: |
          URL="https://ashrafbusiness440-eng.github.io/Shadow-Live-/app/deploy.json"
          for ATTEMPT in $(seq 1 90); do
            BODY=$(curl --silent --show-error "$URL?phase8=$GITHUB_RUN_ID" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "Production Pages did not reach commit $GITHUB_SHA"
          exit 1

      - name: Production URL smoke
        run: |
          curl --fail --silent --show-error https://shadow-live.ashraf-business-440.workers.dev/health
          curl --fail --silent --show-error https://ashrafbusiness440-eng.github.io/Shadow-Live-/app/ > /dev/null
          curl --fail --silent --show-error https://ashrafbusiness440-eng.github.io/Shadow-Live-/control/ > /dev/null
          echo "PASS production URLs"

      - name: Core Cloudflare API smoke
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/e2e-smoke.mjs

      - name: Firestore cooldown after core smoke
        run: sleep 8

      - name: Phase 9 user moderation E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/phase9-user-moderation-e2e.mjs

      - name: Firestore cooldown after moderation
        run: sleep 8

      - name: Phase 9 role and capability E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/phase9-user-access-e2e.mjs

      - name: Firestore cooldown after access
        run: sleep 8

      - name: Chat core E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/chat-core-e2e.mjs

      - name: Firestore cooldown after chat core
        run: sleep 5

      - name: Chat safety E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/chat-safety-e2e.mjs

      - name: Firestore cooldown after chat safety
        run: sleep 5

      - name: Chat gift E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/chat-gift-e2e.mjs

      - name: Firestore cooldown after chat gift
        run: sleep 5

      - name: Wallet E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/wallet-e2e.mjs

      - name: Firestore cooldown after wallet
        run: sleep 5

      - name: Room gift E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/room-gift-e2e.mjs

      - name: Firestore cooldown after room gift
        run: sleep 5

      - name: Voice phase 1 E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/voice-session-e2e.mjs

      - name: Firestore cooldown after voice phase 1
        run: sleep 5

      - name: Voice phase 2 and ZEGO E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/voice-phase2-e2e.mjs

      - name: Firestore cooldown after voice phase 2
        run: sleep 5

      - name: Economy router E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/economy-router-e2e.mjs

      - name: Firestore cooldown after economy router
        run: sleep 8

      - name: Games settlements cron and RNG E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALLOW_PRODUCTION_DURABLE_OBJECT_E2E: '0'
        run: node cloudflare-worker/scripts/phase6-settlement-e2e.mjs

      - name: Firestore cooldown after game settlement
        run: sleep 8

      - name: Google Play migration guards E2E
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/scripts/google-play-e2e.mjs

      - name: Phase 8 summary
        run: |
          {
            echo "## Phase 8 Comprehensive E2E — PASS"
            echo
            echo "- Phase 7 cutover audit: PASS"
            echo "- Cloudflare Worker exact build: PASS"
            echo "- Production Pages exact build: PASS"
            echo "- Core API / Chat / Safety / Gifts: PASS"
            echo "- User moderation / roles / capabilities: PASS"
            echo "- Wallet / Room Gifts: PASS"
            echo "- Voice / ZEGO / Mic activity: PASS"
            echo "- Economy Router: PASS"
            echo "- Games / Settlements / Cron / RNG: PASS"
            echo "- Google Play guards: PASS"
            echo "- App Asset Manager full write/delete E2E: MANUAL / RELEASE-ONLY"
            echo "- Automatic gate performs no GitHub asset mutation commits"
          } >> "$GITHUB_STEP_SUMMARY"
