<body>
  <script>
    // Recovery deploy: remove any stale Shadow Control / old Flutter PWA cache
    // before loading the current Shadow Live production bundle.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=shadow-live-20260922-recovery" async></script>
</body>
