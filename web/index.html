  <title>Shadow Control</title>
  <link rel="manifest" href="manifest.json">

<body>
  <script>
    // Shadow Control is an admin PWA. Always prefer the newest deployed build
    // so privileged UI/API fixes are not held by an old Flutter service worker.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=control-20260920-2" async></script>
</body>
